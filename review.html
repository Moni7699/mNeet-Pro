<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Answer Review | mNEET</title>

<style>
:root {
  --bg: #f3f7f4;
  --card: #ffffff;
  --text: #17251d;
  --muted: #6c7b71;
  --green: #168348;
  --green-bg: #e2f5e9;
  --red: #d83232;
  --red-bg: #ffebeb;
  --gray: #e7ece9;
  --border: #dce6df;
}

body.dark {
  --bg: #101713;
  --card: #1b2620;
  --text: #edf5ef;
  --muted: #a5b6aa;
  --green: #48c783;
  --green-bg: #203d2d;
  --red: #ff6868;
  --red-bg: #512727;
  --gray: #303b35;
  --border: #34453a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  transition: background .2s, color .2s;
}

button {
  font: inherit;
}

.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 13px;
  position: sticky;
  top: 0;
  z-index: 10;
}

.toprow {
  max-width: 800px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.brand {
  font-size: 23px;
  font-weight: 900;
  color: var(--green);
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 17px 12px 30px;
}

.muted {
  color: var(--muted);
  font-size: 12px;
  line-height: 1.6;
}

.btn {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 11px 13px;
  min-height: 43px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.btn:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.primary {
  background: var(--green);
  color: #ffffff;
}

.secondary {
  background: var(--card);
  color: var(--text);
}

.filters {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 12px 1px;
  scrollbar-width: thin;
}

.filter {
  white-space: nowrap;
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 9px 13px;
  background: var(--card);
  color: var(--text);
  font-weight: 700;
  cursor: pointer;
}

.filter.active {
  background: var(--green);
  color: #ffffff;
  border-color: var(--green);
}

.numbers {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 6px 2px 14px;
  scrollbar-width: thin;
}

.number {
  flex: 0 0 43px;
  height: 43px;
  border: 1px solid var(--border);
  border-radius: 11px;
  font-weight: 800;
  background: var(--gray);
  color: var(--text);
  cursor: pointer;
}

.number.correct {
  background: var(--green-bg);
  border-color: var(--green);
  color: var(--green);
}

.number.wrong {
  background: var(--red-bg);
  border-color: var(--red);
  color: var(--red);
}

.number.skipped {
  color: var(--muted);
}

.number.current {
  outline: 3px solid var(--text);
  outline-offset: 1px;
}

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 17px;
}

.qtop {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 13px;
}

.badge {
  font-size: 11px;
  font-weight: 800;
  padding: 7px 9px;
  border-radius: 99px;
  background: var(--gray);
}

.badge.correct {
  background: var(--green-bg);
  color: var(--green);
}

.badge.wrong {
  background: var(--red-bg);
  color: var(--red);
}

.badge.skipped {
  color: var(--muted);
}

.question {
  font-size: 18px;
  line-height: 1.6;
  font-weight: 700;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.qimage {
  display: none;
  width: 100%;
  max-height: 300px;
  object-fit: contain;
  margin: 14px 0;
  border-radius: 10px;
}

.options {
  display: grid;
  gap: 9px;
  margin-top: 17px;
}

.option {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--bg);
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.option.correct {
  background: var(--green-bg);
  border: 2px solid var(--green);
}

.option.wrong {
  background: var(--red-bg);
  border: 2px solid var(--red);
}

.letter {
  flex: 0 0 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-weight: 800;
}

.solution {
  margin-top: 15px;
  background: var(--green-bg);
  padding: 13px;
  border-radius: 11px;
  white-space: pre-wrap;
  line-height: 1.6;
  font-size: 14px;
  overflow-wrap: anywhere;
}

.navigation {
  display: flex;
  gap: 9px;
  margin-top: 13px;
}

.navigation .btn {
  flex: 1;
}

.back-area {
  margin-top: 16px;
}

.back-area .btn {
  width: 100%;
}

.message {
  padding: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  line-height: 1.6;
}

.hidden {
  display: none !important;
}

@media (min-width: 600px) {
  .container {
    padding-top: 24px;
  }

  .card {
    padding: 24px;
  }

  .options {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>

<body>

<header class="topbar">
  <div class="toprow">
    <div>
      <div class="brand">mNEET</div>
      <div class="muted">Answer Review &amp; Solutions</div>
    </div>

    <button class="btn secondary" id="themeBtn" type="button">
      🌙 Dark
    </button>
  </div>
</header>

<main class="container">

  <h2 id="pageTitle">Review Answers</h2>

  <div class="muted" id="summary"></div>

  <div class="filters" id="filters">
    <button class="filter active" data-filter="all" type="button">All</button>
    <button class="filter" data-filter="correct" type="button">Correct</button>
    <button class="filter" data-filter="wrong" type="button">Incorrect</button>
    <button class="filter" data-filter="skipped" type="button">Skipped</button>
  </div>

  <div class="numbers" id="numbers"></div>

  <div id="empty" class="card hidden">
    No questions found for this filter.
  </div>

  <section class="card" id="questionCard">

    <div class="qtop">
      <strong id="questionNumber">Question 1</strong>
      <span class="badge" id="statusBadge"></span>
    </div>

    <div class="question" id="questionText"></div>

    <img
      id="questionImage"
      class="qimage"
      alt="Question diagram"
    >

    <div class="options" id="options"></div>

    <div class="solution" id="solution"></div>

  </section>

  <div class="navigation">
    <button class="btn secondary" id="prevBtn" type="button">
      ← Previous
    </button>

    <button class="btn primary" id="nextBtn" type="button">
      Next →
    </button>
  </div>

  <div class="back-area">
    <a class="btn secondary" href="result.html">
      ← Back to Result
    </a>
  </div>

</main>

<script>
(function () {
  "use strict";

  const $ = id => document.getElementById(id);

  let result;

  try {
    result = JSON.parse(
      localStorage.getItem("mneetQuizResult") || "null"
    );
  } catch (error) {
    result = null;
  }

  if (!result || !Array.isArray(result.questions)) {
    $("questionCard").classList.add("hidden");
    $("numbers").classList.add("hidden");
    $("filters").classList.add("hidden");
    $("prevBtn").classList.add("hidden");
    $("nextBtn").classList.add("hidden");

    $("empty").classList.remove("hidden");
    $("empty").textContent =
      "No quiz result found. Please submit a quiz first.";

    $("summary").textContent =
      "Your submitted quiz answers will appear here.";

    $("pageTitle").textContent = "Answer Review";

    // Theme controls remain available when no result is found.
    function applyTheme() {
      const dark =
        localStorage.getItem("mneetTheme") === "dark";

      document.body.classList.toggle("dark", dark);

      $("themeBtn").textContent =
        dark ? "☀️ Light" : "🌙 Dark";
    }

    applyTheme();

    $("themeBtn").onclick = function () {
      localStorage.setItem(
        "mneetTheme",
        localStorage.getItem("mneetTheme") === "dark"
          ? "light"
          : "dark"
      );

      applyTheme();
    };

    return;
  }

  const questions = result.questions;

  let activeFilter = "all";
  let visibleQuestions = [];
  let position = 0;

  function applyTheme() {
    const dark =
      localStorage.getItem("mneetTheme") === "dark";

    document.body.classList.toggle("dark", dark);

    $("themeBtn").textContent =
      dark ? "☀️ Light" : "🌙 Dark";
  }

  applyTheme();

  $("themeBtn").onclick = function () {
    localStorage.setItem(
      "mneetTheme",
      localStorage.getItem("mneetTheme") === "dark"
        ? "light"
        : "dark"
    );

    applyTheme();
  };

  function getStatus(question) {
    if (question.submitted !== true) {
      return "skipped";
    }

    return String(question.selected || "").toUpperCase() ===
      String(question.correctOption || "").toUpperCase()
        ? "correct"
        : "wrong";
  }

  function renderNumbers() {
    const box = $("numbers");
    box.replaceChildren();

    visibleQuestions.forEach((item, index) => {
      const button = document.createElement("button");

      button.type = "button";

      button.className =
        "number " +
        getStatus(item.question) +
        (index === position ? " current" : "");

      button.textContent = item.originalIndex + 1;

      button.setAttribute(
        "aria-label",
        "Question " + (item.originalIndex + 1) +
        ", " + getStatus(item.question)
      );

      button.setAttribute(
        "aria-current",
        index === position ? "true" : "false"
      );

      button.onclick = function () {
        position = index;
        renderPage();
      };

      box.appendChild(button);
    });

    const current = box.querySelector(".current");

    if (current) {
      current.scrollIntoView({
        behavior: "smooth",
        block: "nearest",
        inline: "center"
      });
    }
  }

  function renderQuestion() {
    const item = visibleQuestions[position];

    if (!item) return;

    const q = item.question;
    const status = getStatus(q);

    $("pageTitle").textContent =
      result.quizTitle || result.title || "Answer Review";

    $("summary").textContent =
      "Showing " + (position + 1) +
      " of " + visibleQuestions.length +
      " filtered questions • " +
      questions.length + " total questions";

    $("questionNumber").textContent =
      "Question " + (item.originalIndex + 1);

    $("statusBadge").textContent =
      status === "correct"
        ? "Correct ✓"
        : status === "wrong"
          ? "Incorrect ✕"
          : "Skipped";

    $("statusBadge").className = "badge " + status;

    $("questionText").textContent = q.question || "";

    const image = $("questionImage");

    image.onerror = function () {
      image.style.display = "none";
    };

    if (q.imageUrl) {
      image.src = q.imageUrl;
      image.style.display = "block";
    } else {
      image.removeAttribute("src");
      image.style.display = "none";
    }

    const optionsBox = $("options");
    optionsBox.replaceChildren();

    const options = Array.isArray(q.options)
      ? q.options
      : [];

    options.forEach((option, index) => {
      const letter =
        option.letter ||
        ["A", "B", "C", "D"][index];

      const textValue =
        option.text ??
        option[letter] ??
        "";

      if (!String(textValue).trim()) {
        return;
      }

      const row = document.createElement("div");
      row.className = "option";

      const normalizedLetter =
        String(letter).toUpperCase();

      const correctOption =
        String(q.correctOption || "").toUpperCase();

      const selectedOption =
        String(q.selected || "").toUpperCase();

      if (normalizedLetter === correctOption) {
        row.classList.add("correct");
      } else if (normalizedLetter === selectedOption) {
        row.classList.add("wrong");
      }

      const letterBox = document.createElement("span");
      letterBox.className = "letter";
      letterBox.textContent = letter;

      const textBox = document.createElement("span");
      textBox.textContent = textValue;

      row.append(letterBox, textBox);
      optionsBox.appendChild(row);
    });

    $("solution").textContent = q.solution
      ? "Solution: " + q.solution
      : "No solution or NCERT reference is available for this question.";

    $("prevBtn").disabled = position === 0;

    $("nextBtn").disabled =
      position === visibleQuestions.length - 1;
  }

  function renderPage() {
    visibleQuestions = questions
      .map((question, originalIndex) => ({
        question,
        originalIndex
      }))
      .filter(item =>
        activeFilter === "all" ||
        getStatus(item.question) === activeFilter
      );

    if (position >= visibleQuestions.length) {
      position = Math.max(
        0,
        visibleQuestions.length - 1
      );
    }

    $("empty").classList.toggle(
      "hidden",
      visibleQuestions.length > 0
    );

    $("questionCard").classList.toggle(
      "hidden",
      visibleQuestions.length === 0
    );

    $("numbers").classList.toggle(
      "hidden",
      visibleQuestions.length === 0
    );

    if (visibleQuestions.length === 0) {
      $("empty").textContent =
        "No questions found for this filter.";
    }

    renderNumbers();

    if (visibleQuestions.length > 0) {
      renderQuestion();
    }

    $("prevBtn").disabled =
      visibleQuestions.length === 0 ||
      position === 0;

    $("nextBtn").disabled =
      visibleQuestions.length === 0 ||
      position >= visibleQuestions.length - 1;
  }

  $("filters")
    .querySelectorAll("button")
    .forEach(button => {
      button.onclick = function () {
        activeFilter = button.dataset.filter;
        position = 0;

        $("filters")
          .querySelectorAll("button")
          .forEach(item => {
            item.classList.toggle(
              "active",
              item === button
            );
          });

        renderPage();
      };
    });

  $("prevBtn").onclick = function () {
    if (position > 0) {
      position--;
      renderPage();
    }
  };

  $("nextBtn").onclick = function () {
    if (position < visibleQuestions.length - 1) {
      position++;
      renderPage();
    }
  };

  renderPage();

})();
</script>

</body>
</html>
