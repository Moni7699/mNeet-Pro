<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#176b3a">
  <title>mNEET-Pro | Admin Panel</title>
  <link rel="stylesheet" href="./css/admin.css">
</head>

<body>
  <section id="authView" class="auth-page">
    <div class="auth-card">
      <div class="brand">m<span>NEET</span><small>PRO ADMIN</small></div>

      <div id="signinBox">
        <h1>Admin Sign In</h1>
        <p>Sign in to manage mNEET-Pro.</p>

        <form id="signinForm">
          <label>Email</label>
          <input id="loginEmail" type="email" required autocomplete="email">

          <label>Password</label>
          <input id="loginPassword" type="password" required
                 autocomplete="current-password">

          <button class="btn primary full" type="submit">Sign In</button>
        </form>

        <button class="text-btn" id="forgotBtn">Forgot Password?</button>
        <p id="authMessage" class="message"></p>
      </div>
    </div>
  </section>

  <section id="appView" hidden>
    <div id="scrim" class="scrim"></div>

    <aside id="sidebar" class="sidebar">
      <div class="side-brand">
        <div class="brand">m<span>NEET</span></div>
        <button id="closeSidebar" class="icon-btn mobile-only">✕</button>
      </div>

      <div class="profile-box">
        <img id="sidePhoto" src="../assets/avatar.svg" alt="Admin profile">
        <h3 id="sideName">Admin</h3>
        <p id="sideEmail"></p>
        <p id="sidePhone"></p>
      </div>

      <nav id="navMenu">
        <button data-page="dashboard">▦ Dashboard</button>
        <button data-page="courses">▣ Courses</button>
        <button data-page="subjects">▤ Subjects</button>
        <button data-page="chapters">▤ Chapters</button>
        <button data-page="topics">▤ Topics</button>
        <button data-page="quizzes">◉ Quizzes</button>
        <button data-page="questions">❓ Questions</button>
        <button data-page="notes">▧ Notes</button>
        <button data-page="ncert">▧ NCERT</button>
        <button data-page="pyq">▧ PYQ</button>
        <button data-page="mockTests">▣ Full Mock Tests</button>
        <button data-page="students">♙ Students</button>
        <button data-page="purchases">₹ Purchases</button>
        <button data-page="notifications">♧ Notifications</button>
        <button data-page="profile">♙ Profile</button>
        <button data-page="settings">⚙ Settings</button>
      </nav>

      <div class="side-bottom">
        <button id="sidebarThemeToggle">☼ Dark / Light Mode</button>
        <button id="sidebarLogout">↪ Logout</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="menuToggle" class="icon-btn" aria-label="Open menu">☰</button>
        <h2 id="topAdminName">Admin Dashboard</h2>
        <div class="top-actions">
          <button id="themeToggle" class="icon-btn" aria-label="Change theme">◐</button>
          <button id="topNotifications" class="icon-btn" aria-label="Notifications">♧</button>
          <button id="topLogout" class="btn outline">Logout</button>
        </div>
      </header>

      <div class="content-wrap">
        <div id="pageContent"></div>
      </div>
    </main>

    <div id="toast" class="toast" role="status"></div>
    <div id="modalRoot"></div>
  </section>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
