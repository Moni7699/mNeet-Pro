<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071A12">
  <title>Admin Login | mNEET</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #071A12;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #0D2419;
      border: 1px solid #28513A;
      border-radius: 18px;
      box-shadow: 0 15px 45px #0005;
    }

    .logo {
      margin: 0;
      text-align: center;
      font-size: 38px;
      font-weight: 800;
    }

    .logo span { color: #FFC107; }

    h2 {
      text-align: center;
      margin: 12px 0;
    }

    .subtitle {
      color: #D1D5DB;
      text-align: center;
      line-height: 1.6;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid #28513A;
      border-radius: 9px;
      background: #10291D;
      color: #fff;
      font-size: 16px;
    }

    input:focus {
      outline: 2px solid #FFC107;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #FFC107;
      color: #071A12;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    a {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #FFC107;
      text-decoration: none;
      font-size: 14px;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #172C21;
      overflow-wrap: anywhere;
      line-height: 1.6;
      font-size: 14px;
    }

    #message.show { display: block; }
    #message.error { color: #FCA5A5; }
    #message.success { color: #86EFAC; }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #9CA3AF;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1 class="logo">m<span>NEET</span></h1>
    <h2>Admin Login</h2>

    <p class="subtitle">
      Secure access to the mNEET Administration Panel
    </p>

    <form id="adminLoginForm">
      <label for="adminEmail">Admin Email</label>
      <input
        id="adminEmail"
        type="email"
        value="mi4286803@gmail.com"
        autocomplete="username"
        required
      >

      <label for="adminPassword">Password</label>
      <input
        id="adminPassword"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In to Admin
      </button>
    </form>

    <a href="#" id="forgotPassword">Forgot Password?</a>

    <div id="message" role="status" aria-live="polite"></div>

    <a href="index.html">Back to Student Login</a>

    <div class="footer">mNEET Admin Portal</div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script src="firebase.js"></script>

  <script>
  (function () {
    "use strict";

    const ADMIN_EMAIL = "mi4286803@gmail.com";
    const ADMIN_UID = "vMMaKyl7NoRv2BcthmDobbBXfZE3";
    const PROJECT_ID = "mneet-spark";

    const form = document.getElementById("adminLoginForm");
    const emailInput = document.getElementById("adminEmail");
    const passwordInput = document.getElementById("adminPassword");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const forgot = document.getElementById("forgotPassword");

    let busy = false;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "show " + (type || "error");
    }

    function getFirebase() {
      const f = window.MNEETFirebase;

      if (
        !f ||
        f.ready !== true ||
        !f.auth ||
        !f.db ||
        f.projectId !== PROJECT_ID
      ) {
        throw new Error(
          "Firebase চালু হয়নি। firebase.js ও Firebase project পরীক্ষা করো।"
        );
      }

      return f;
    }

    function readableError(error) {
      const messages = {
        "auth/invalid-credential":
          "Email অথবা Password ভুল।",
        "auth/wrong-password":
          "Password ভুল।",
        "auth/user-not-found":
          "Firebase Authentication-এ এই Email-এর account নেই।",
        "auth/invalid-email":
          "Email address সঠিক নয়।",
        "auth/too-many-requests":
          "অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে চেষ্টা করো।",
        "auth/network-request-failed":
          "Internet connection পরীক্ষা করো।",
        "auth/user-disabled":
          "এই Firebase account বন্ধ করা হয়েছে।",
        "permission-denied":
          "Firestore Security Rules Admin document পড়তে দিচ্ছে না।",
        "unavailable":
          "Firebase সাময়িকভাবে পাওয়া যাচ্ছে না।"
      };

      return messages[error.code] ||
        error.message ||
        "অজানা সমস্যা হয়েছে।";
    }

    async function verifyAdmin(user, db) {
      if (user.email !== ADMIN_EMAIL) {
        throw new Error("Admin Email মেলেনি।");
      }

      if (user.uid !== ADMIN_UID) {
        throw new Error("Admin UID মেলেনি।");
      }
console.log("Firebase project:", db.app.options.projectId);
console.log("Admin UID:", ADMIN_UID);
      const snapshot = await db
        .collection("admins")
        .doc(ADMIN_UID)
        .get();

      if (!snapshot.exists) {
        throw new Error(
          "Admin verification document পাওয়া যায়নি।"
        );
      }

      const data = snapshot.data() || {};

      if (data.active !== true) {
        throw new Error(
          "Admin account সক্রিয় নয়।"
        );
      }

      if (
        data.email &&
        data.email.toLowerCase() !== ADMIN_EMAIL
      ) {
        throw new Error("Admin document-এর Email মেলেনি।");
      }
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (busy) return;

      busy = true;
      button.disabled = true;
      button.textContent = "Verifying...";
      message.className = "";

      const enteredEmail =
        emailInput.value.trim().toLowerCase();

      let signedIn = false;

      try {
        const f = getFirebase();

        if (enteredEmail !== ADMIN_EMAIL) {
          throw new Error("সঠিক Admin Email ব্যবহার করো।");
        }

        const result = await f.auth.signInWithEmailAndPassword(
          enteredEmail,
          passwordInput.value
        );

        signedIn = true;

        await verifyAdmin(result.user, f.db);

        showMessage(
          "Admin verification সফল। Dashboard খুলছে...",
          "success"
        );

        window.location.replace("admin.html");

      } catch (error) {
        console.error("Admin login error:", error);

        if (signedIn) {
          try {
            await getFirebase().auth.signOut();
          } catch (signOutError) {
            console.error(signOutError);
          }
        }

        showMessage(readableError(error), "error");

        busy = false;
        button.disabled = false;
        button.textContent = "Sign In to Admin";
      }
    });

    forgot.addEventListener("click", async function (event) {
      event.preventDefault();

      try {
        const f = getFirebase();

        await f.auth.sendPasswordResetEmail(ADMIN_EMAIL);

        showMessage(
          "Password reset email পাঠানোর অনুরোধ করা হয়েছে। Inbox ও Spam পরীক্ষা করো।",
          "success"
        );
      } catch (error) {
        showMessage(readableError(error), "error");
      }
    });
  })();
  </script>
</body>
</html>
