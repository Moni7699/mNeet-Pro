<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071A12">
  <title>mNEET Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #071A12;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #0D2419;
      border: 1px solid #28513A;
      border-radius: 18px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 36px;
    }

    h1 span {
      color: #22C55E;
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #D1D5DB;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border-radius: 9px;
      border: 1px solid #28513A;
      background: #10291D;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #16A34A;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    button:disabled {
      opacity: .6;
    }

    a {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #22C55E;
      text-decoration: none;
      font-size: 14px;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #172C21;
      line-height: 1.6;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #message.show {
      display: block;
    }

    #message.error {
      color: #FCA5A5;
    }

    #message.success {
      color: #86EFAC;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>m<span>NEET</span></h1>
    <h2>Admin Login</h2>

    <p class="subtitle">
      Sign in to the mNEET administration panel.
    </p>

    <form id="adminLoginForm">
      <label for="adminEmail">Admin Email</label>
      <input
        id="adminEmail"
        type="email"
        value="moni7640t@gmail.com"
        autocomplete="username"
        required
      >

      <label for="adminPassword">Password</label>
      <input
        id="adminPassword"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your Firebase password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In to Admin
      </button>
    </form>

    <a href="#" id="forgotPassword">Forgot Password?</a>

    <div id="message" role="status" aria-live="polite"></div>

    <a href="index.html">Back to Student Login</a>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script src="firebase.js"></script>

  <script>
    (function () {
      "use strict";

      const ADMIN_UID = "4Erqg1MOhnf6XznVTIdGX4vL23C2";

      const form = document.getElementById("adminLoginForm");
      const emailInput = document.getElementById("adminEmail");
      const passwordInput = document.getElementById("adminPassword");
      const button = document.getElementById("loginButton");
      const message = document.getElementById("message");

      let busy = false;

      function showMessage(text, type) {
        message.textContent = text;
        message.className = "show " + (type || "error");
      }

      function getServices() {
        const services = window.MNEETFirebase;

        if (
          !services ||
          services.ready !== true ||
          !services.auth ||
          !services.db ||
          services.projectId !== "mneet-spark"
        ) {
          throw new Error(
            "Firebase চালু হয়নি। firebase.js এবং Firebase SDK পরীক্ষা করো।"
          );
        }

        return services;
      }

      function describeError(error) {
        const code = error && error.code;

        const known = {
          "auth/invalid-credential":
            "Email অথবা Password ভুল। Firebase Authentication পরীক্ষা করো.",

          "auth/wrong-password":
            "Password ভুল। Firebase-এ সঠিক Password ব্যবহার করো.",

          "auth/user-not-found":
            "এই Email-এর Firebase Authentication account পাওয়া যায়নি.",

          "auth/invalid-email":
            "Email address সঠিক নয়.",

          "auth/too-many-requests":
            "অনেকবার চেষ্টা করা হয়েছে। পরে আবার চেষ্টা করো.",

          "auth/network-request-failed":
            "Internet connection পরীক্ষা করো.",

          "permission-denied":
            "Firestore Security Rules Admin document পড়তে দিচ্ছে না.",

          "unavailable":
            "Firebase সাময়িকভাবে পাওয়া যাচ্ছে না। Internet পরীক্ষা করো.",

          "failed-precondition":
            "Firestore configuration বা database setup পরীক্ষা করতে হবে."
        };

        if (code && known[code]) {
          return known[code] + " ( " + code + " )";
        }

        if (error && error.message) {
          return error.message;
        }

        return "অজানা Error হয়েছে। আবার চেষ্টা করো.";
      }

      async function checkAdmin(user, db) {
        if (user.uid !== ADMIN_UID) {
          throw new Error(
            "Login সফল, কিন্তু এই Email-এর UID নির্ধারিত Admin UID-এর সঙ্গে মিলছে না."
          );
        }

        let snapshot;

        try {
          snapshot = await db
            .collection("admins")
            .doc(ADMIN_UID)
            .get();
        } catch (error) {
          console.error("Firestore admin check failed:", error);
          throw new Error(
            "Admin document পড়া যাচ্ছে না: " + describeError(error)
          );
        }

        if (!snapshot.exists) {
          throw new Error(
            "Firestore-এ admins/" + ADMIN_UID +
            " document পাওয়া যায়নি। Firebase Console-এ সঠিক document তৈরি করো."
          );
        }

        const data = snapshot.data() || {};

        if (data.active !== true) {
          throw new Error(
            "Admin document পাওয়া গেছে, কিন্তু active field Boolean true নয়."
          );
        }
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (busy) return;

        busy = true;
        button.disabled = true;
        button.textContent = "Checking...";
        message.className = "";
        message.textContent = "";

        let user = null;

        try {
          const services = getServices();

          const result = await services.auth
            .signInWithEmailAndPassword(
              emailInput.value.trim().toLowerCase(),
              passwordInput.value
            );

          user = result.user;

          showMessage(
            "Login সফল। Admin permission যাচাই হচ্ছে...",
            "success"
          );

          await checkAdmin(user, services.db);

          showMessage(
            "Admin যাচাই সফল। Dashboard খোলা হচ্ছে...",
            "success"
          );

          window.location.replace("admin.html");

        } catch (error) {
          console.error("[mNEET Admin Login]", error);

          if (user) {
            try {
              await getServices().auth.signOut();
            } catch (signOutError) {
              console.error("Sign-out error:", signOutError);
            }
          }

          showMessage(describeError(error), "error");

          busy = false;
          button.disabled = false;
          button.textContent = "Sign In to Admin";
        }
      });

      document.getElementById("forgotPassword")
        .addEventListener("click", async function (event) {
          event.preventDefault();

          try {
            const services = getServices();

            await services.auth.sendPasswordResetEmail(
              emailInput.value.trim().toLowerCase()
            );

            showMessage(
              "Password reset নির্দেশনা পাঠানো হলে Email inbox পরীক্ষা করো.",
              "success"
            );
          } catch (error) {
            showMessage(describeError(error), "error");
          }
        });
    })();
  </script>
</body>
</html>
