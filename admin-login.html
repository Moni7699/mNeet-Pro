<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071A12">

  <title>Admin Login | mNEET</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #071A12;
      --card: #0D2419;
      --green: #16A34A;
      --light-green: #22C55E;
      --white: #FFFFFF;
      --muted: #D1D5DB;
      --input: #10291D;
      --border: #28513A;
      --danger: #FCA5A5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(
          circle at top right,
          #123A27 0,
          transparent 40%
        ),
        var(--bg);
      color: var(--white);
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 32px 25px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
    }

    .logo {
      margin: 0;
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--light-green);
    }

    .badge {
      width: fit-content;
      margin: 12px auto 25px;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 30px;
      color: var(--light-green);
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    h2 {
      margin: 0 0 9px;
      text-align: center;
      font-size: 24px;
    }

    .subtitle {
      margin: 0 0 25px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      min-height: 49px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--input);
      color: var(--white);
      font-size: 16px;
    }

    input:focus {
      border-color: var(--light-green);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.12);
    }

    button {
      width: 100%;
      min-height: 49px;
      margin-top: 23px;
      border: 0;
      border-radius: 10px;
      background: var(--green);
      color: var(--white);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #15803D;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .forgot {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: var(--light-green);
      font-size: 14px;
      text-decoration: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--white);
      font-size: 14px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .message.show {
      display: block;
    }

    .message.error {
      color: var(--danger);
      border-color: #7F1D1D;
    }

    .message.success {
      color: #86EFAC;
    }

    .back-link {
      display: block;
      margin-top: 25px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      text-decoration: none;
    }

    .back-link:hover,
    .forgot:hover {
      text-decoration: underline;
    }

    @media (max-width: 400px) {
      .login-card {
        padding: 26px 18px;
      }

      .logo {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <main class="login-card">
    <h1 class="logo">m<span>NEET</span></h1>

    <div class="badge">ADMIN ACCESS</div>

    <h2>Admin Login</h2>

    <p class="subtitle">
      Sign in using your authorized administrator account.
    </p>

    <form id="adminLoginForm">
      <label for="adminEmail">Email Address</label>

      <input
        type="email"
        id="adminEmail"
        name="email"
        placeholder="Enter admin email"
        autocomplete="username"
        required
      >

      <label for="adminPassword">Password</label>

      <input
        type="password"
        id="adminPassword"
        name="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="loginButton">
        Sign In to Admin
      </button>
    </form>

    <a href="#" class="forgot" id="forgotPassword">
      Forgot Password?
    </a>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
      hidden
    ></div>

    <a href="index.html" class="back-link">
      ← Back to Student Login
    </a>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <script src="firebase.js"></script>

  <script>
    (function () {
      "use strict";

      const form = document.getElementById("adminLoginForm");
      const emailInput = document.getElementById("adminEmail");
      const passwordInput = document.getElementById("adminPassword");
      const button = document.getElementById("loginButton");
      const message = document.getElementById("message");
      const forgotLink = document.getElementById("forgotPassword");

      let busy = false;

      function showMessage(text, type) {
        message.textContent = text;
        message.className = "message show " + (type || "");
        message.hidden = false;
      }

      function getFirebase() {
        const services = window.MNEETFirebase;

        if (
          !services ||
          services.ready !== true ||
          !services.auth ||
          !services.db ||
          services.projectId !== "mneet-spark"
        ) {
          throw new Error(
            "Firebase is not ready. Refresh the page and try again."
          );
        }

        return services;
      }

      function friendlyError(error) {
        const code = error && error.code;

        const messages = {
          "auth/invalid-credential":
            "Email or password is incorrect.",

          "auth/wrong-password":
            "Email or password is incorrect.",

          "auth/user-not-found":
            "Email or password is incorrect.",

          "auth/invalid-email":
            "Enter a valid email address.",

          "auth/too-many-requests":
            "Too many attempts. Try again later.",

          "auth/network-request-failed":
            "Network error. Check your internet connection.",

          "permission-denied":
            "Admin verification was blocked by Firebase Rules."
        };

        return messages[code] ||
          (error && error.message
            ? error.message
            : "Something went wrong. Please try again.");
      }

      async function verifyAdmin(user) {
        const services = getFirebase();

        const snapshot = await services.db
          .collection("admins")
          .doc(user.uid)
          .get();

        if (!snapshot.exists) {
          throw new Error(
            "This account is not registered as an administrator."
          );
        }

        const adminData = snapshot.data() || {};

        if (adminData.active !== true) {
          throw new Error(
            "This administrator account is not active."
          );
        }

        return true;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (busy) {
          return;
        }

        busy = true;
        button.disabled = true;
        button.textContent = "Verifying...";
        message.hidden = true;
        message.className = "message";

        let signedInUser = null;

        try {
          const services = getFirebase();
          const email = emailInput.value.trim().toLowerCase();

          const credential = await services.auth
            .signInWithEmailAndPassword(
              email,
              passwordInput.value
            );

          signedInUser = credential.user;

          await verifyAdmin(signedInUser);

          showMessage(
            "Admin verified. Opening dashboard...",
            "success"
          );

          window.location.replace("admin.html");

        } catch (error) {
          console.error("[mNEET Admin Login]", error);

          if (signedInUser) {
            try {
              await getFirebase().auth.signOut();
            } catch (signOutError) {
              console.error(
                "[mNEET] Sign-out error:",
                signOutError
              );
            }
          }

          showMessage(friendlyError(error), "error");

          busy = false;
          button.disabled = false;
          button.textContent = "Sign In to Admin";
        }
      });

      forgotLink.addEventListener("click", async function (event) {
        event.preventDefault();

        const email = emailInput.value.trim().toLowerCase();

        if (!email) {
          showMessage(
            "Enter your email address first.",
            "error"
          );

          emailInput.focus();
          return;
        }

        try {
          await getFirebase().auth.sendPasswordResetEmail(email);

          showMessage(
            "If this email is registered, a password reset email will be sent.",
            "success"
          );
        } catch (error) {
          console.error("[mNEET Password Reset]", error);

          showMessage(friendlyError(error), "error");
        }
      });
    })();
  </script>

</body>
</html>
