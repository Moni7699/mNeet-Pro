<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071A12">
  <title>mNEET Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #071A12;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 28px;
      background: #0D2419;
      border: 1px solid #28513A;
      border-radius: 18px;
      box-shadow: 0 15px 45px #0005;
    }

    .logo {
      margin: 0;
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      color: #fff;
    }

    .logo span {
      color: #FFC107;
    }

    h2 {
      margin: 12px 0 8px;
      text-align: center;
    }

    .subtitle {
      margin-bottom: 24px;
      text-align: center;
      color: #D1D5DB;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 12px;
      border: 1px solid #28513A;
      border-radius: 9px;
      background: #10291D;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #FFC107;
    }

    button {
      width: 100%;
      min-height: 48px;
      margin-top: 22px;
      border: 0;
      border-radius: 9px;
      background: #FFC107;
      color: #071A12;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    a {
      display: block;
      margin-top: 18px;
      text-align: center;
      color: #FFC107;
      text-decoration: none;
      font-size: 14px;
    }

    #message {
      display: none;
      margin-top: 18px;
      padding: 12px;
      border-radius: 8px;
      background: #172C21;
      line-height: 1.6;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #message.show {
      display: block;
    }

    #message.error {
      color: #FCA5A5;
    }

    #message.success {
      color: #86EFAC;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #9CA3AF;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1 class="logo">m<span>NEET</span></h1>

    <h2>Admin Login</h2>

    <p class="subtitle">
      Secure access to the mNEET Administration Panel
    </p>

    <form id="adminLoginForm">

      <label for="adminEmail">Admin Email</label>

      <input
        id="adminEmail"
        type="email"
        value="mi4286803@gmail.com"
        autocomplete="username"
        required
      >

      <label for="adminPassword">Password</label>

      <input
        id="adminPassword"
        type="password"
        autocomplete="current-password"
        placeholder="Enter your password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In to Admin
      </button>

    </form>

    <a href="#" id="forgotPassword">
      Forgot Password?
    </a>

    <div
      id="message"
      role="status"
      aria-live="polite"
    ></div>

    <a href="index.html">
      Back to Student Login
    </a>

    <div class="footer">
      mNEET Admin Portal
    </div>

  </main>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <!-- Existing Firebase configuration -->
  <script src="firebase.js"></script>

  <script>
    (function () {
      "use strict";

      const ADMIN_EMAIL = "mi4286803@gmail.com";

      const ADMIN_UID =
        "vMMaKyl7NoRv2BcthmDobbBXfZE3";

      const PROJECT_ID = "mneet-spark";

      const form =
        document.getElementById("adminLoginForm");

      const emailInput =
        document.getElementById("adminEmail");

      const passwordInput =
        document.getElementById("adminPassword");

      const button =
        document.getElementById("loginButton");

      const message =
        document.getElementById("message");

      const forgotPassword =
        document.getElementById("forgotPassword");

      let busy = false;

      function showMessage(text, type = "error") {
        message.textContent = text;
        message.className = "show " + type;
      }

      function getFirebase() {
        const services = window.MNEETFirebase;

        if (
          !services ||
          services.ready !== true ||
          !services.auth ||
          !services.db ||
          services.projectId !== PROJECT_ID
        ) {
          throw new Error(
            "Firebase চালু হয়নি। firebase.js এবং Firebase SDK পরীক্ষা করো।"
          );
        }

        return services;
      }

      function readableError(error) {
        const code = error && error.code;

        const errors = {
          "auth/invalid-credential":
            "Email অথবা Password ভুল।",

          "auth/wrong-password":
            "Password ভুল।",

          "auth/user-not-found":
            "এই Email দিয়ে Firebase Authentication account পাওয়া যায়নি।",

          "auth/invalid-email":
            "Email address সঠিক নয়।",

          "auth/too-many-requests":
            "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে চেষ্টা করো।",

          "auth/network-request-failed":
            "Internet connection পরীক্ষা করো।",

          "auth/user-disabled":
            "এই Firebase account বন্ধ করা আছে।",

          "permission-denied":
            "Firestore Security Rules Admin document পড়তে দিচ্ছে না।",

          "unavailable":
            "Firebase সাময়িকভাবে পাওয়া যাচ্ছে না।"
        };

        if (code && errors[code]) {
          return errors[code] + " (" + code + ")";
        }

        return error && error.message
          ? error.message
          : "অজানা সমস্যা হয়েছে।";
      }

      async function verifyAdmin(user, db) {
        if (user.email !== ADMIN_EMAIL) {
          throw new Error(
            "এই Email Admin Email-এর সঙ্গে মিলছে না।"
          );
        }

        if (user.uid !== ADMIN_UID) {
          throw new Error(
            "Firebase Authentication UID নির্ধারিত Admin UID-এর সঙ্গে মিলছে না।"
          );
        }

        const doc = await db
          .collection("admins")
          .doc(ADMIN_UID)
          .get();

        if (!doc.exists) {
          throw new Error(
            "Firestore-এ admins/" +
            ADMIN_UID +
            " document পাওয়া যায়নি।"
          );
        }

        const data = doc.data() || {};

        if (data.active !== true) {
          throw new Error(
            "Admin document-এর active field Boolean true হতে হবে।"
          );
        }

        if (
          data.email &&
          data.email.toLowerCase() !== ADMIN_EMAIL
        ) {
          throw new Error(
            "Firestore Admin Email মিলছে না।"
          );
        }

        return true;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();

        if (busy) return;

        busy = true;
        button.disabled = true;
        button.textContent = "Checking...";
        message.className = "";

        let user = null;

        try {
          const services = getFirebase();

          const enteredEmail =
            emailInput.value.trim().toLowerCase();

          if (enteredEmail !== ADMIN_EMAIL) {
            throw new Error(
              "সঠিক Admin Email ব্যবহার করো।"
            );
          }

          const result = await services.auth
            .signInWithEmailAndPassword(
              enteredEmail,
              passwordInput.value
            );

          user = result.user;

          showMessage(
            "Login সফল। Admin permission যাচাই হচ্ছে...",
            "success"
          );

          await verifyAdmin(user, services.db);

          showMessage(
            "Admin verification সফল! Dashboard খুলছে...",
            "success"
          );

          window.location.replace("admin.html");

        } catch (error) {
          console.error(
            "mNEET Admin Login Error:",
            error
          );

          if (user) {
            try {
              await getFirebase().auth.signOut();
            } catch (signOutError) {
              console.error(signOutError);
            }
          }

          showMessage(
            readableError(error),
            "error"
          );

          busy = false;
          button.disabled = false;
          button.textContent = "Sign In to Admin";
        }
      });

      forgotPassword.addEventListener(
        "click",
        async function (event) {
          event.preventDefault();

          try {
            const services = getFirebase();

            await services.auth.sendPasswordResetEmail(
              ADMIN_EMAIL
            );

            showMessage(
              "Password reset email পাঠানোর অনুরোধ করা হয়েছে। Inbox ও Spam folder পরীক্ষা করো।",
              "success"
            );

          } catch (error) {
            showMessage(
              readableError(error),
              "error"
            );
          }
        }
      );

    })();
  </script>

</body>
</html>
