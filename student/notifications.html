<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146c43"><title>Notifications | mNEET-Pro</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script></head><body><header><a class="brand" href="dashboard.html">mNEET-Pro</a><div><a href="profile.html">Profile</a> <button class="secondary" data-logout>Logout</button></div></header><div id="message" class="message" hidden></div><main class="wrap"><h1>Notifications</h1><section class="card"><div id="notifications" class="empty">Loading notifications…</div></section></main><nav class="bottom-nav"><a href="dashboard.html">Dashboard</a><a href="courses.html">Courses</a><a href="profile.html">Profile</a><a href="notifications.html">Notifications</a></nav><script>(async()=>{try{let u=await MN.requireUser(),box=$('#notifications'),snap=await db.collection('notifications').where('active','==',true).get().catch(()=>({docs:[]}));let mine=snap.docs.filter(d=>{let x=d.data();return !x.uid||x.uid===u.uid});box.innerHTML='';if(!mine.length){box.textContent='No notifications yet.';return}mine.sort((a,b)=>((b.data().createdAt?.seconds||0)-(a.data().createdAt?.seconds||0)));mine.forEach(d=>{let x=d.data(),el=document.createElement('article');el.className='list-item';el.innerHTML='<div><b>'+MN.esc(x.title||'Notification')+'</b><p>'+MN.esc(x.message||'')+'</p></div>';box.append(el)})}catch(e){}})();</script></body></html>
