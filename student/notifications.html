<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#0d6035">

<title>mNEET-Pro | Notifications</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#f3f6f4;
    color:#17221a;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font-family:inherit;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    min-height:64px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 13px;
    background:#fff;
    border-bottom:1px solid #dce5de;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.back-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:11px;
    background:#e8f2eb;
    color:#0d6035;
    font-size:21px;
    cursor:pointer;
}

.header-title{
    font-size:16px;
    font-weight:900;
}

.header-subtitle{
    margin-top:3px;
    color:#78837c;
    font-size:9px;
}

.header-right{
    margin-left:auto;
}

.unread-count{
    min-width:28px;
    height:28px;
    padding:0 7px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:20px;
    background:#0d6035;
    color:#fff;
    font-size:9px;
    font-weight:900;
}

.main{
    width:100%;
    max-width:750px;
    margin:auto;
    padding:14px 12px 50px;
}

.top-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:14px;
    border:1px solid #dce5de;
    border-radius:15px;
    background:#fff;
}

.top-text strong{
    display:block;
    font-size:12px;
}

.top-text span{
    display:block;
    margin-top:4px;
    color:#77827a;
    font-size:8px;
}

.clear-btn{
    min-height:36px;
    padding:0 11px;
    border:1px solid #d5dfd8;
    border-radius:9px;
    background:#f7faf8;
    color:#455249;
    font-size:8px;
    font-weight:900;
    cursor:pointer;
}

.notifications{
    margin-top:12px;
}

.notification{
    position:relative;
    display:flex;
    gap:11px;
    padding:14px;
    margin-bottom:9px;
    border:1px solid #dce5de;
    border-radius:15px;
    background:#fff;
    box-shadow:0 3px 12px rgba(0,0,0,.035);
}

.notification.unread{
    border-left:4px solid #0d6035;
    background:#fbfefc;
}

.notification-icon{
    width:39px;
    height:39px;
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:11px;
    background:#e8f3ec;
    font-size:18px;
}

.notification-content{
    min-width:0;
    flex:1;
}

.notification-title{
    font-size:11px;
    font-weight:900;
    line-height:1.35;
}

.notification-message{
    margin-top:5px;
    color:#647168;
    font-size:9px;
    line-height:1.55;
    word-break:break-word;
}

.notification-time{
    margin-top:7px;
    color:#929c95;
    font-size:7px;
    font-weight:700;
}

.unread-dot{
    position:absolute;
    top:12px;
    right:12px;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#0d6035;
}

.loading{
    padding:70px 20px;
    text-align:center;
    color:#77827a;
    font-size:10px;
}

.spinner{
    width:34px;
    height:34px;
    margin:0 auto 12px;
    border:4px solid #dce8df;
    border-top-color:#0d6035;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.empty{
    padding:65px 20px;
    text-align:center;
    border:1px solid #dce5de;
    border-radius:16px;
    background:#fff;
}

.empty-icon{
    font-size:42px;
}

.empty h3{
    margin-top:10px;
    font-size:15px;
}

.empty p{
    margin-top:6px;
    color:#78837c;
    font-size:9px;
}

.error{
    padding:35px 20px;
    text-align:center;
    border:1px solid #ead3d3;
    border-radius:16px;
    background:#fff;
    color:#a52b2b;
    font-size:10px;
}

@media(max-width:480px){

    .main{
        padding-left:10px;
        padding-right:10px;
    }

}

</style>

</head>


<body>


<header class="header">

    <button
        id="backButton"
        class="back-btn"
    >
        ←
    </button>


    <div>

        <div class="header-title">
            Notifications
        </div>

        <div class="header-subtitle">
            Important updates & announcements
        </div>

    </div>


    <div class="header-right">

        <div
            id="unreadCount"
            class="unread-count"
        >
            0
        </div>

    </div>

</header>


<main class="main">


    <section class="top-card">

        <div class="top-text">

            <strong>
                Your Notifications
            </strong>

            <span>
                Latest updates from mNEET-Pro
            </span>

        </div>


        <button
            id="markAllRead"
            class="clear-btn"
        >
            Mark All Read
        </button>

    </section>


    <section
        id="notifications"
        class="notifications"
    >

        <div class="loading">

            <div class="spinner"></div>

            Loading notifications...

        </div>

    </section>


</main>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyApQOM_mtFZ16RiNJEaIUhb4iYFBIBRK58",

    authDomain:
        "mneet-spark.firebaseapp.com",

    databaseURL:
        "https://mneet-spark-default-rtdb.firebaseio.com",

    projectId:
        "mneet-spark",

    storageBucket:
        "mneet-spark.firebasestorage.app",

    messagingSenderId:
        "252201633700",

    appId:
        "1:252201633700:web:1a1e7a2cff1f0b168ea331"

};


if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}


const auth =
    firebase.auth();

const db =
    firebase.firestore();


let currentUser = null;

let notificationData = [];


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(
    async function(user){

        if(!user){

            window.location.replace(
                "index.html"
            );

            return;

        }

        currentUser = user;

        await loadNotifications();

    }
);


/* =====================================================
   LOAD NOTIFICATIONS
===================================================== */

async function loadNotifications(){

    const container =
        document.getElementById(
            "notifications"
        );


    try{

        /*
         * Expected Firestore structure:
         *
         * notifications
         *    notificationId
         *
         *      title
         *      message
         *      type
         *      userId
         *      createdAt
         *      read
         *
         */


        const snapshot =
            await db
            .collection("notifications")
            .get();


        notificationData = [];


        snapshot.forEach(
            function(doc){

                const data =
                    doc.data() || {};


                /*
                 * Show:
                 *
                 * 1. Global notifications
                 * 2. Current user's notifications
                 */

                if(
                    !data.userId ||
                    data.userId === currentUser.uid
                ){

                    notificationData.push({

                        id:doc.id,

                        ...data

                    });

                }

            }
        );


        /*
         * Sort newest first.
         */

        notificationData.sort(
            function(a,b){

                const aTime =
                    getTimestamp(
                        a.createdAt
                    );

                const bTime =
                    getTimestamp(
                        b.createdAt
                    );

                return bTime - aTime;

            }
        );


        renderNotifications();


    }catch(error){

        console.error(
            "Notification error:",
            error
        );


        container.innerHTML =

            `

            <div class="error">

                Notifications load করতে সমস্যা হয়েছে।
                <br><br>

                Firestore rules এবং
                notifications collection check করুন।

            </div>

            `;

    }

}


/* =====================================================
   RENDER
===================================================== */

function renderNotifications(){

    const container =
        document.getElementById(
            "notifications"
        );


    if(
        notificationData.length === 0
    ){

        container.innerHTML =

            `

            <div class="empty">

                <div class="empty-icon">
                    🔔
                </div>

                <h3>
                    No Notifications
                </h3>

                <p>
                    এখনো আপনার জন্য কোনো notification নেই।
                </p>

            </div>

            `;


        updateUnreadCount();

        return;

    }


    container.innerHTML = "";


    notificationData.forEach(
        function(item){

            const isRead =
                item.read === true;


            const icon =
                getNotificationIcon(
                    item.type
                );


            const title =
                item.title ||
                "mNEET-Pro Update";


            const message =
                item.message ||
                item.body ||
                "You have a new notification.";


            const time =
                formatDate(
                    item.createdAt
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "notification" +
                (
                    isRead
                        ? ""
                        : " unread"
                );


            div.innerHTML =

                `

                <div class="notification-icon">
                    ${icon}
                </div>


                <div class="notification-content">

                    <div class="notification-title">
                        ${escapeHtml(title)}
                    </div>

                    <div class="notification-message">
                        ${escapeHtml(message)}
                    </div>

                    <div class="notification-time">
                        ${escapeHtml(time)}
                    </div>

                </div>

                ${
                    isRead
                    ? ""
                    : '<div class="unread-dot"></div>'
                }

                `;


            div.addEventListener(
                "click",
                function(){

                    markNotificationRead(
                        item.id
                    );

                }
            );


            container.appendChild(
                div
            );

        }
    );


    updateUnreadCount();

}


/* =====================================================
   MARK ONE READ
===================================================== */

async function markNotificationRead(
    id
){

    const item =
        notificationData.find(
            function(notification){

                return notification.id === id;

            }
        );


    if(!item){

        return;

    }


    if(
        item.read === true
    ){

        return;

    }


    try{

        await db
        .collection("notifications")
        .doc(id)
        .set({

            readBy:
                firebase.firestore
                .FieldValue
                .arrayUnion(
                    currentUser.uid
                )

        },{
            merge:true
        });


        /*
         * Local state update.
         */

        item.read = true;

        renderNotifications();


    }catch(error){

        /*
         * If the database structure uses
         * a simple read field, try it.
         */

        try{

            await db
            .collection("notifications")
            .doc(id)
            .update({

                read:true

            });


            item.read = true;

            renderNotifications();

        }catch(secondError){

            console.log(
                secondError
            );

        }

    }

}


/* =====================================================
   MARK ALL READ
===================================================== */

document
.getElementById("markAllRead")
.addEventListener(
    "click",
    async function(){

        const unread =
            notificationData.filter(
                function(item){

                    return item.read !== true;

                }
            );


        if(
            unread.length === 0
        ){

            return;

        }


        const button =
            document.getElementById(
                "markAllRead"
            );


        button.disabled = true;

        button.textContent =
            "Saving...";


        try{

            /*
             * Update each notification.
             */

            const promises =
                unread.map(
                    function(item){

                        return db
                        .collection("notifications")
                        .doc(item.id)
                        .update({

                            read:true

                        });

                    }
                );


            await Promise.all(
                promises
            );


            unread.forEach(
                function(item){

                    item.read = true;

                }
            );


            renderNotifications();


        }catch(error){

            console.error(
                "Mark all read error:",
                error
            );

            alert(
                "Notifications update করা যায়নি।"
            );

        }


        button.disabled = false;

        button.textContent =
            "Mark All Read";

    }
);


/* =====================================================
   UNREAD COUNT
===================================================== */

function updateUnreadCount(){

    const count =
        notificationData.filter(
            function(item){

                return item.read !== true;

            }
        ).length;


    document
    .getElementById("unreadCount")
    .textContent =
        count > 99
            ? "99+"
            : count;

}


/* =====================================================
   ICON
===================================================== */

function getNotificationIcon(
    type
){

    switch(
        String(type || "").toLowerCase()
    ){

        case "course":
            return "📚";

        case "quiz":
            return "📝";

        case "result":
            return "🏆";

        case "exam":
            return "⏱️";

        case "payment":
            return "💳";

        case "notice":
            return "📢";

        case "success":
            return "✅";

        case "warning":
            return "⚠️";

        default:
            return "🔔";

    }

}


/* =====================================================
   DATE
===================================================== */

function getTimestamp(
    value
){

    if(!value){

        return 0;

    }


    if(
        value.seconds
    ){

        return value.seconds * 1000;

    }


    if(
        value.toDate
    ){

        return value.toDate()
            .getTime();

    }


    const date =
        new Date(value);


    return isNaN(
        date.getTime()
    )
        ? 0
        : date.getTime();

}


function formatDate(
    value
){

    const timestamp =
        getTimestamp(value);


    if(!timestamp){

        return "Recently";

    }


    const date =
        new Date(timestamp);


    return date.toLocaleString(
        "en-IN",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   BACK
===================================================== */

document
.getElementById("backButton")
.addEventListener(
    "click",
    function(){

        window.location.href =
            "dashboard.html";

    }
);

</script>

</body>

</html>
