<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146c43"><title>Profile | mNEET-Pro</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script></head><body><header><a class="brand" href="dashboard.html">mNEET-Pro</a><div><a href="profile.html">Profile</a> <button class="secondary" data-logout>Logout</button></div></header><div id="message" class="message" hidden></div><main class="wrap narrow"><section class="card"><h1>My profile</h1><form id="profile"><label>Full name</label><input name="name" required maxlength="80"><label>Email</label><input name="email" type="email" disabled><label>Phone</label><input name="phone" type="tel" maxlength="20"><button class="full">Save profile</button></form><button class="secondary full" id="password">Send password reset email</button></section></main><nav class="bottom-nav"><a href="dashboard.html">Dashboard</a><a href="courses.html">Courses</a><a href="profile.html">Profile</a><a href="notifications.html">Notifications</a></nav><script>(async()=>{try{let u=await MN.requireUser(),d=await db.collection('students').doc(u.uid).get(),x=d.data()||{};$('#profile [name=name]').value=x.name||u.displayName||'';$('#profile [name=email]').value=u.email||'';$('#profile [name=phone]').value=x.phone||'';$('#profile').onsubmit=async e=>{e.preventDefault();try{await db.collection('students').doc(u.uid).set({uid:u.uid,name:$('#profile [name=name]').value.trim(),email:u.email,phone:$('#profile [name=phone]').value.trim(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});await u.updateProfile({displayName:$('#profile [name=name]').value.trim()});MN.msg('Profile saved.')}catch(err){MN.msg(err.message,true)}};$('#password').onclick=async()=>{try{await auth.sendPasswordResetEmail(u.email);MN.msg('Password reset email sent.')}catch(e){MN.msg(e.message,true)}}}catch(e){}})();</script></body></html>
