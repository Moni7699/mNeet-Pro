<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#0d6035">

<title>mNEET-Pro | Profile</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#f3f6f4;
    color:#17221a;
    font-family:Arial,Helvetica,sans-serif;
}

button,
input{
    font-family:inherit;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    min-height:64px;
    padding:9px 13px;
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    border-bottom:1px solid #dce5de;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.back-btn{
    width:40px;
    height:40px;
    border:0;
    border-radius:11px;
    background:#e8f2eb;
    color:#0d6035;
    font-size:21px;
    cursor:pointer;
}

.header-title{
    font-size:16px;
    font-weight:900;
}

.header-subtitle{
    margin-top:3px;
    color:#78837c;
    font-size:9px;
}

.main{
    width:100%;
    max-width:700px;
    margin:auto;
    padding:16px 13px 40px;
}

.profile-card{
    padding:20px;
    border:1px solid #dce5de;
    border-radius:18px;
    background:#fff;
    box-shadow:0 6px 20px rgba(0,0,0,.05);
}

.avatar{
    width:76px;
    height:76px;
    margin:0 auto 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:linear-gradient(135deg,#0d6035,#269455);
    color:#fff;
    font-size:28px;
    font-weight:900;
}

.profile-name{
    text-align:center;
    font-size:19px;
    font-weight:900;
}

.profile-email{
    margin-top:5px;
    text-align:center;
    color:#77827a;
    font-size:10px;
    word-break:break-word;
}

.section{
    margin-top:14px;
    padding:16px;
    border:1px solid #dce5de;
    border-radius:16px;
    background:#fff;
}

.section-title{
    margin-bottom:14px;
    font-size:13px;
    font-weight:900;
}

.field{
    margin-bottom:13px;
}

.field:last-child{
    margin-bottom:0;
}

.field label{
    display:block;
    margin-bottom:6px;
    color:#526057;
    font-size:9px;
    font-weight:900;
}

.field input{
    width:100%;
    height:44px;
    padding:0 12px;
    border:1px solid #d5ded8;
    border-radius:10px;
    outline:none;
    background:#fafcfb;
    color:#17221a;
    font-size:12px;
}

.field input:focus{
    border-color:#0d6035;
    box-shadow:0 0 0 3px rgba(13,96,53,.09);
}

.save-btn{
    width:100%;
    height:44px;
    margin-top:4px;
    border:0;
    border-radius:11px;
    background:#0d6035;
    color:#fff;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
}

.save-btn:disabled{
    opacity:.6;
}

.option-row{
    min-height:54px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:11px 0;
    border-bottom:1px solid #edf1ee;
}

.option-row:last-child{
    border-bottom:0;
}

.option-info{
    min-width:0;
}

.option-name{
    font-size:11px;
    font-weight:900;
}

.option-description{
    margin-top:4px;
    color:#7b867f;
    font-size:8px;
    line-height:1.4;
}

.toggle{
    width:48px;
    height:27px;
    flex-shrink:0;
    padding:3px;
    border:0;
    border-radius:30px;
    background:#ccd5cf;
    cursor:pointer;
}

.toggle span{
    display:block;
    width:21px;
    height:21px;
    border-radius:50%;
    background:#fff;
    transition:.2s;
}

.toggle.active{
    background:#0d6035;
}

.toggle.active span{
    transform:translateX(21px);
}

.social-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:9px;
}

.social-btn{
    min-height:45px;
    border:1px solid #dce5de;
    border-radius:10px;
    background:#f8faf8;
    color:#26342b;
    font-size:9px;
    font-weight:900;
    cursor:pointer;
}

.social-btn:hover{
    background:#edf5ef;
}

.logout-btn{
    width:100%;
    height:45px;
    margin-top:14px;
    border:1px solid #efcaca;
    border-radius:11px;
    background:#fff5f5;
    color:#c62828;
    font-size:10px;
    font-weight:900;
    cursor:pointer;
}

.message{
    display:none;
    margin-bottom:12px;
    padding:11px;
    border-radius:10px;
    font-size:9px;
    font-weight:800;
    line-height:1.5;
}

.message.success{
    display:block;
    background:#e8f5e9;
    color:#176b35;
}

.message.error{
    display:block;
    background:#ffebee;
    color:#b3261e;
}

.loading{
    padding:70px 20px;
    text-align:center;
    color:#77827a;
    font-size:10px;
}

.spinner{
    width:34px;
    height:34px;
    margin:0 auto 12px;
    border:4px solid #dce8df;
    border-top-color:#0d6035;
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:480px){

    .main{
        padding:13px 10px 30px;
    }

    .profile-card,
    .section{
        border-radius:15px;
    }

    .social-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>


<header class="header">

    <button
        id="backButton"
        class="back-btn"
    >
        ←
    </button>

    <div>

        <div class="header-title">
            My Profile
        </div>

        <div class="header-subtitle">
            Student account & preferences
        </div>

    </div>

</header>


<main class="main">

    <div id="loadingBox" class="loading">

        <div class="spinner"></div>

        Loading profile...

    </div>


    <div id="profileContent" style="display:none;">


        <!-- PROFILE -->

        <section class="profile-card">

            <div
                id="avatar"
                class="avatar"
            >
                M
            </div>

            <div
                id="profileName"
                class="profile-name"
            >
                Student
            </div>

            <div
                id="profileEmail"
                class="profile-email"
            >
                —
            </div>

        </section>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
            style="margin-top:14px;"
        ></div>


        <!-- PERSONAL INFORMATION -->

        <section class="section">

            <div class="section-title">
                👤 Personal Information
            </div>


            <div class="field">

                <label>
                    STUDENT NAME
                </label>

                <input
                    id="nameInput"
                    type="text"
                    placeholder="Enter your name"
                    autocomplete="name"
                >

            </div>


            <div class="field">

                <label>
                    EMAIL ADDRESS
                </label>

                <input
                    id="emailInput"
                    type="email"
                    disabled
                >

            </div>


            <button
                id="saveProfile"
                class="save-btn"
            >
                Save Profile
            </button>

        </section>


        <!-- TARGET -->

        <section class="section">

            <div class="section-title">
                🎯 NEET Target
            </div>


            <div class="field">

                <label>
                    TARGET DATE
                </label>

                <input
                    id="targetDate"
                    type="date"
                >

            </div>


            <div class="field">

                <label>
                    DREAM TARGET
                </label>

                <input
                    id="dreamTarget"
                    type="text"
                    placeholder="Example: AIIMS Delhi / 700+"
                >

            </div>


            <button
                id="saveTarget"
                class="save-btn"
            >
                Save Target
            </button>

        </section>


        <!-- APPEARANCE -->

        <section class="section">

            <div class="section-title">
                ⚙️ App Preferences
            </div>


            <div class="option-row">

                <div class="option-info">

                    <div class="option-name">
                        🌙 Dark Mode
                    </div>

                    <div class="option-description">
                        Change the app appearance
                    </div>

                </div>


                <button
                    id="darkToggle"
                    class="toggle"
                    aria-label="Dark mode"
                >
                    <span></span>
                </button>

            </div>


            <div class="option-row">

                <div class="option-info">

                    <div class="option-name">
                        ☀️ White Mode
                    </div>

                    <div class="option-description">
                        Use the normal light interface
                    </div>

                </div>


                <button
                    id="whiteToggle"
                    class="toggle active"
                    aria-label="White mode"
                >
                    <span></span>
                </button>

            </div>

        </section>


        <!-- SOCIAL -->

        <section class="section">

            <div class="section-title">
                🔗 Official Links
            </div>


            <div class="social-grid">

                <button
                    class="social-btn"
                    onclick="openLink('youtube')"
                >
                    ▶ YouTube Channel
                </button>


                <button
                    class="social-btn"
                    onclick="openLink('facebook')"
                >
                    f Facebook Page
                </button>


                <button
                    class="social-btn"
                    onclick="openLink('instagram')"
                >
                    ◎ Instagram
                </button>


                <button
                    class="social-btn"
                    onclick="openLink('whatsapp')"
                >
                    ☎ WhatsApp Community
                </button>

            </div>

        </section>


        <!-- LOGOUT -->

        <section class="section">

            <button
                id="logoutButton"
                class="logout-btn"
            >
                🚪 Logout Account
            </button>

        </section>


    </div>

</main>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyApQOM_mtFZ16RiNJEaIUhb4iYFBIBRK58",

    authDomain:
        "mneet-spark.firebaseapp.com",

    databaseURL:
        "https://mneet-spark-default-rtdb.firebaseio.com",

    projectId:
        "mneet-spark",

    storageBucket:
        "mneet-spark.firebasestorage.app",

    messagingSenderId:
        "252201633700",

    appId:
        "1:252201633700:web:1a1e7a2cff1f0b168ea331"

};


if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}

const auth =
    firebase.auth();

const db =
    firebase.firestore();


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(
    async function(user){

        if(!user){

            window.location.replace(
                "index.html"
            );

            return;

        }

        currentUser = user;

        await loadProfile();

        loadTheme();

    }
);


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

    try{

        const userRef =
            db
            .collection("users")
            .doc(currentUser.uid);


        const snapshot =
            await userRef.get();


        let data = {};


        if(snapshot.exists){

            data =
                snapshot.data() || {};

        }


        const name =
            data.name ||
            data.displayName ||
            currentUser.displayName ||
            "Student";


        document
            .getElementById("profileName")
            .textContent =
                name;


        document
            .getElementById("profileEmail")
            .textContent =
                currentUser.email ||
                "No email";


        document
            .getElementById("avatar")
            .textContent =
                getInitials(name);


        document
            .getElementById("nameInput")
            .value =
                name === "Student"
                    ? ""
                    : name;


        document
            .getElementById("emailInput")
            .value =
                currentUser.email || "";


        document
            .getElementById("targetDate")
            .value =
                data.targetDate ||
                "";


        document
            .getElementById("dreamTarget")
            .value =
                data.dreamTarget ||
                "";


        document
            .getElementById("loadingBox")
            .style.display =
                "none";


        document
            .getElementById("profileContent")
            .style.display =
                "block";


    }catch(error){

        console.error(
            "Profile loading error:",
            error
        );


        document
            .getElementById("loadingBox")
            .innerHTML =
                "Profile load করতে সমস্যা হয়েছে। Firebase Firestore check করুন।";

    }

}


/* =====================================================
   SAVE PROFILE
===================================================== */

document
.getElementById("saveProfile")
.addEventListener(
    "click",
    async function(){

        const name =
            document
            .getElementById("nameInput")
            .value
            .trim();


        if(!name){

            showMessage(
                "Student name দিন।",
                "error"
            );

            return;

        }


        const button =
            document
            .getElementById("saveProfile");


        button.disabled = true;

        button.textContent =
            "Saving...";


        try{

            await db
            .collection("users")
            .doc(currentUser.uid)
            .set({

                name:name,

                email:
                    currentUser.email || "",

                updatedAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            },{
                merge:true
            });


            try{

                await currentUser
                    .updateProfile({

                        displayName:name

                    });

            }catch(e){

                console.log(
                    "Auth profile update skipped",
                    e
                );

            }


            document
            .getElementById("profileName")
            .textContent =
                name;


            document
            .getElementById("avatar")
            .textContent =
                getInitials(name);


            showMessage(
                "Profile successfully saved ✓",
                "success"
            );


        }catch(error){

            console.error(error);

            showMessage(
                "Profile save হয়নি। Firestore rules check করুন।",
                "error"
            );

        }


        button.disabled = false;

        button.textContent =
            "Save Profile";

    }
);


/* =====================================================
   SAVE TARGET
===================================================== */

document
.getElementById("saveTarget")
.addEventListener(
    "click",
    async function(){

        const targetDate =
            document
            .getElementById("targetDate")
            .value;


        const dreamTarget =
            document
            .getElementById("dreamTarget")
            .value
            .trim();


        const button =
            document
            .getElementById("saveTarget");


        button.disabled = true;

        button.textContent =
            "Saving...";


        try{

            await db
            .collection("users")
            .doc(currentUser.uid)
            .set({

                targetDate:
                    targetDate,

                dreamTarget:
                    dreamTarget,

                updatedAt:
                    firebase.firestore
                    .FieldValue
                    .serverTimestamp()

            },{
                merge:true
            });


            showMessage(
                "NEET target successfully saved ✓",
                "success"
            );


        }catch(error){

            console.error(error);

            showMessage(
                "Target save হয়নি। Firestore rules check করুন।",
                "error"
            );

        }


        button.disabled = false;

        button.textContent =
            "Save Target";

    }
);


/* =====================================================
   DARK MODE
===================================================== */

document
.getElementById("darkToggle")
.addEventListener(
    "click",
    function(){

        setDarkMode(true);

    }
);


/* =====================================================
   WHITE MODE
===================================================== */

document
.getElementById("whiteToggle")
.addEventListener(
    "click",
    function(){

        setDarkMode(false);

    }
);


/* =====================================================
   THEME
===================================================== */

function setDarkMode(
    dark
){

    if(dark){

        document.body.style.background =
            "#101512";

        document.body.style.color =
            "#f3f7f4";

        localStorage.setItem(
            "appTheme",
            "dark"
        );


        document
        .getElementById("darkToggle")
        .classList.add("active");


        document
        .getElementById("whiteToggle")
        .classList.remove("active");


        showMessage(
            "Dark mode enabled.",
            "success"
        );

    }else{

        document.body.style.background =
            "#f3f6f4";

        document.body.style.color =
            "#17221a";

        localStorage.setItem(
            "appTheme",
            "light"
        );


        document
        .getElementById("darkToggle")
        .classList.remove("active");


        document
        .getElementById("whiteToggle")
        .classList.add("active");


        showMessage(
            "White mode enabled.",
            "success"
        );

    }

}


/* =====================================================
   LOAD THEME
===================================================== */

function loadTheme(){

    const theme =
        localStorage.getItem(
            "appTheme"
        );


    if(theme === "dark"){

        setDarkMode(
            true
        );

    }else{

        setDarkMode(
            false
        );

    }

}


/* =====================================================
   SOCIAL LINKS
===================================================== */

function openLink(
    type
){

    /*
     * এখানে পরে তোমার actual
     * official links বসাবে।
     */

    const links = {

        youtube:
            "https://www.youtube.com/",

        facebook:
            "https://www.facebook.com/",

        instagram:
            "https://www.instagram.com/",

        whatsapp:
            "https://chat.whatsapp.com/"

    };


    if(
        links[type]
    ){

        window.open(
            links[type],
            "_blank"
        );

    }

}


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById("logoutButton")
.addEventListener(
    "click",
    async function(){

        const confirmLogout =
            confirm(
                "আপনি কি সত্যিই logout করতে চান?"
            );


        if(!confirmLogout){

            return;

        }


        try{

            await auth.signOut();


            localStorage.removeItem(
                "activeCourse"
            );

            localStorage.removeItem(
                "activeChapter"
            );

            localStorage.removeItem(
                "activeTopic"
            );


            window.location.replace(
                "index.html"
            );


        }catch(error){

            console.error(
                error
            );


            showMessage(
                "Logout করা যায়নি। আবার চেষ্টা করুন।",
                "error"
            );

        }

    }
);


/* =====================================================
   BACK BUTTON
===================================================== */

document
.getElementById("backButton")
.addEventListener(
    "click",
    function(){

        window.location.href =
            "dashboard.html";

    }
);


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer = null;


function showMessage(
    text,
    type
){

    const box =
        document.getElementById(
            "message"
        );


    box.textContent =
        text;


    box.className =
        "message " +
        type;


    clearTimeout(
        messageTimer
    );


    messageTimer =
        setTimeout(
            function(){

                box.className =
                    "message";

            },
            3000
        );

}


/* =====================================================
   INITIALS
===================================================== */

function getInitials(
    name
){

    const words =
        name
        .trim()
        .split(/\s+/);


    if(!words.length){

        return "M";

    }


    if(words.length === 1){

        return words[0]
            .charAt(0)
            .toUpperCase();

    }


    return (
        words[0].charAt(0) +
        words[words.length - 1].charAt(0)
    ).toUpperCase();

}

</script>

</body>

</html>
