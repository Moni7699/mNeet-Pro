<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146c43"><title>Result | mNEET-Pro</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script></head><body><header><a class="brand" href="dashboard.html">mNEET-Pro</a><div><a href="profile.html">Profile</a> <button class="secondary" data-logout>Logout</button></div></header><div id="message" class="message" hidden></div><main class="wrap"><section class="card"><h1>Quiz result</h1><div id="result" class="empty">Loading result…</div><div class="row"><button class="secondary" onclick="history.back()">Back</button><a class="btn" href="courses.html">Courses</a></div></section><section class="card"><h2>Answer review</h2><div id="review"></div></section></main><nav class="bottom-nav"><a href="dashboard.html">Dashboard</a><a href="courses.html">Courses</a><a href="profile.html">Profile</a><a href="notifications.html">Notifications</a></nav><script> (async()=>{try{let u=await MN.requireUser(),r=JSON.parse(localStorage.getItem('mnlastresult')||'null');if(!r){$('#result').textContent='No recent quiz result found on this device.';return}$('#result').className='grid';$('#result').innerHTML='<div><span class="muted">Score</span><h2>'+r.score+'</h2></div><div><span class="muted">Correct</span><h2>'+r.correct+'</h2></div><div><span class="muted">Incorrect</span><h2>'+r.wrong+'</h2></div><div><span class="muted">Skipped</span><h2>'+r.skipped+'</h2></div><div><span class="muted">Accuracy</span><h2>'+r.accuracy+'%</h2></div>';let box=$('#review');box.innerHTML='';r.questions.forEach((q,i)=>{let el=document.createElement('article');el.className='card';let a=r.answers[i]===undefined?'Skipped':q.options[Number(r.answers[i])];el.innerHTML='<h3>'+(i+1)+'. '+MN.esc(q.question)+'</h3><p>Your answer: '+MN.esc(a)+'</p><p>Correct answer: <b>'+MN.esc(q.options[Number(q.answer)]||'Not set')+'</b></p><p class="muted">'+MN.esc(q.explanation||'')+'</p>';box.append(el)})}catch(e){}})();</script></body></html>
