<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
      content="#0d6035">

<title>mNEET-Pro | Notes</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    background:#f3f6f4;
    color:#18221b;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
}


/* =====================================================
   HEADER
===================================================== */

.header{

    position:sticky;

    top:0;

    z-index:100;

    min-height:64px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    padding:9px 13px;

    background:#fff;

    border-bottom:
        1px solid #dce5de;

    box-shadow:
        0 4px 15px
        rgba(0,0,0,.06);

}

.header-left{

    min-width:0;

    display:flex;

    align-items:center;

    gap:9px;

}

.back-btn{

    width:40px;

    height:40px;

    flex-shrink:0;

    border:0;

    border-radius:11px;

    background:#eaf3ed;

    color:#0d6035;

    font-size:21px;

    cursor:pointer;

}

.title-box{

    min-width:0;

}

.small-title{

    font-size:8px;

    color:#7b867f;

    font-weight:900;

    text-transform:uppercase;

}

.page-title{

    max-width:210px;

    margin-top:3px;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    font-size:13px;

    font-weight:900;

}

.header-action{

    flex-shrink:0;

    height:38px;

    padding:0 11px;

    border:0;

    border-radius:10px;

    background:#0d6035;

    color:#fff;

    font-size:9px;

    font-weight:900;

    cursor:pointer;

}


/* =====================================================
   MAIN
===================================================== */

.main{

    width:100%;

    max-width:1000px;

    margin:auto;

    padding:14px 12px 100px;

}


/* =====================================================
   INFO CARD
===================================================== */

.info-card{

    padding:15px;

    border:
        1px solid #dce5de;

    border-radius:16px;

    background:#fff;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.04);

}

.info-top{

    display:flex;

    justify-content:space-between;

    align-items:flex-start;

    gap:10px;

}

.info-heading{

    min-width:0;

}

.info-heading h2{

    font-size:16px;

    font-weight:900;

}

.info-heading p{

    margin-top:5px;

    color:#748078;

    font-size:9px;

    line-height:1.45;

}

.read-badge{

    flex-shrink:0;

    padding:7px 9px;

    border-radius:8px;

    background:#edf7f0;

    color:#0d6035;

    font-size:8px;

    font-weight:900;

}


/* =====================================================
   PDF AREA
===================================================== */

.pdf-card{

    margin-top:13px;

    overflow:hidden;

    border:
        1px solid #dce5de;

    border-radius:16px;

    background:#fff;

    box-shadow:
        0 5px 18px
        rgba(0,0,0,.04);

}

.pdf-toolbar{

    min-height:50px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:8px;

    padding:8px 10px;

    background:#f8faf8;

    border-bottom:
        1px solid #e1e7e2;

}

.pdf-status{

    min-width:0;

    font-size:8px;

    font-weight:900;

    color:#68756c;

}

.pdf-buttons{

    display:flex;

    gap:6px;

}

.pdf-btn{

    height:32px;

    padding:0 9px;

    border:0;

    border-radius:8px;

    background:#e7eee9;

    color:#34443a;

    font-size:8px;

    font-weight:900;

    cursor:pointer;

}

.pdf-btn.primary{

    background:#0d6035;

    color:#fff;

}


/* =====================================================
   PDF VIEWER
===================================================== */

.pdf-viewer{

    width:100%;

    height:70vh;

    min-height:500px;

    background:#525659;

}

.pdf-viewer iframe{

    display:block;

    width:100%;

    height:100%;

    border:0;

}

.pdf-fallback{

    display:none;

    min-height:300px;

    padding:35px 20px;

    text-align:center;

    background:#f8faf8;

}

.pdf-fallback-icon{

    font-size:42px;

}

.pdf-fallback h3{

    margin-top:10px;

    font-size:15px;

}

.pdf-fallback p{

    margin-top:6px;

    color:#78837c;

    font-size:9px;

    line-height:1.5;

}

.open-pdf{

    display:inline-flex;

    align-items:center;

    justify-content:center;

    min-height:40px;

    margin-top:15px;

    padding:0 15px;

    border-radius:10px;

    background:#0d6035;

    color:#fff;

    text-decoration:none;

    font-size:9px;

    font-weight:900;

}


/* =====================================================
   READING ACTION
===================================================== */

.read-card{

    margin-top:13px;

    padding:15px;

    border:
        1px solid #dce5de;

    border-radius:16px;

    background:#fff;

}

.read-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

}

.read-text{

    min-width:0;

}

.read-text strong{

    display:block;

    font-size:11px;

}

.read-text span{

    display:block;

    margin-top:4px;

    color:#7b867f;

    font-size:8px;

}

.mark-read{

    flex-shrink:0;

    min-height:39px;

    padding:0 13px;

    border:0;

    border-radius:10px;

    background:#0d6035;

    color:#fff;

    font-size:9px;

    font-weight:900;

    cursor:pointer;

}

.mark-read.completed{

    background:#18864b;

}


/* =====================================================
   PROGRESS
===================================================== */

.progress-wrap{

    margin-top:13px;

}

.progress-label{

    display:flex;

    justify-content:space-between;

    font-size:8px;

    color:#6d7971;

    font-weight:800;

}

.progress-track{

    height:7px;

    margin-top:6px;

    overflow:hidden;

    border-radius:20px;

    background:#e4ebe6;

}

.progress-fill{

    width:0;

    height:100%;

    border-radius:20px;

    background:#0d6035;

    transition:.3s;

}


/* =====================================================
   NAVIGATION
===================================================== */

.navigation{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:9px;

    margin-top:13px;

}

.nav-btn{

    min-height:45px;

    border:0;

    border-radius:11px;

    font-size:9px;

    font-weight:900;

    cursor:pointer;

}

.previous{

    background:#e6ece8;

    color:#34443a;

}

.next{

    background:#0d6035;

    color:#fff;

}

.nav-btn:disabled{

    opacity:.45;

    cursor:not-allowed;

}


/* =====================================================
   LOADING
===================================================== */

.loading{

    padding:70px 20px;

    text-align:center;

    color:#748078;

    font-size:10px;

}

.spinner{

    width:36px;

    height:36px;

    margin:
        0 auto 12px;

    border:
        4px solid #dce8df;

    border-top-color:
        #0d6035;

    border-radius:50%;

    animation:
        spin .8s linear infinite;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =====================================================
   ERROR
===================================================== */

.error-box{

    padding:30px 20px;

    text-align:center;

    border:
        1px solid #e0e6e1;

    border-radius:16px;

    background:#fff;

}

.error-icon{

    font-size:40px;

}

.error-box h3{

    margin-top:10px;

    font-size:16px;

}

.error-box p{

    margin-top:6px;

    color:#78837c;

    font-size:9px;

    line-height:1.5;

}

.error-button{

    min-height:40px;

    margin-top:15px;

    padding:0 15px;

    border:0;

    border-radius:10px;

    background:#0d6035;

    color:#fff;

    font-size:9px;

    font-weight:900;

}


/* =====================================================
   TOAST
===================================================== */

.toast{

    position:fixed;

    left:50%;

    bottom:20px;

    z-index:500;

    width:
        calc(100% - 30px);

    max-width:400px;

    padding:12px 15px;

    border-radius:11px;

    background:#17221a;

    color:#fff;

    text-align:center;

    font-size:9px;

    font-weight:700;

    opacity:0;

    pointer-events:none;

    transform:
        translate(-50%,20px);

    transition:.25s;

}

.toast.show{

    opacity:1;

    transform:
        translate(-50%,0);

}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:700px){

    .main{

        padding-left:20px;

        padding-right:20px;

    }

    .pdf-viewer{

        height:75vh;

    }

    .page-title{

        max-width:450px;

    }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

    <div class="header-left">

        <button
            id="backButton"
            class="back-btn"
            aria-label="Back"
        >
            ←
        </button>


        <div class="title-box">

            <div class="small-title">
                NCERT / NOTES
            </div>

            <div
                id="pageTitle"
                class="page-title"
            >
                Loading...
            </div>

        </div>

    </div>


    <button
        id="openButton"
        class="header-action"
    >
        Open PDF
    </button>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <div id="mainContent">

        <div class="loading">

            <div class="spinner"></div>

            Loading Notes...

        </div>

    </div>


</main>


<div
    id="toast"
    class="toast"
></div>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyApQOM_mtFZ16RiNJEaIUhb4iYFBIBRK58",

    authDomain:
        "mneet-spark.firebaseapp.com",

    databaseURL:
        "https://mneet-spark-default-rtdb.firebaseio.com",

    projectId:
        "mneet-spark",

    storageBucket:
        "mneet-spark.firebasestorage.app",

    messagingSenderId:
        "252201633700",

    appId:
        "1:252201633700:web:1a1e7a2cff1f0b168ea331"

};


if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}


const auth =
    firebase.auth();

const db =
    firebase.firestore();


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let courseId = null;

let chapterId = null;

let topicId = null;

let topicData = null;

let notesUrl = "";

let topicList = [];

let currentTopicIndex = 0;


/* =====================================================
   AUTH
===================================================== */

auth.onAuthStateChanged(
    async function(user){

        if(!user){

            window.location.replace(
                "index.html"
            );

            return;

        }


        currentUser = user;


        courseId =
            localStorage.getItem(
                "activeCourse"
            );

        chapterId =
            localStorage.getItem(
                "activeChapter"
            );

        topicId =
            localStorage.getItem(
                "activeTopic"
            );


        if(
            !courseId ||
            !chapterId ||
            !topicId
        ){

            showError(
                "Course, chapter অথবা topic পাওয়া যায়নি।"
            );

            return;

        }


        await loadNotes();

    }
);


/* =====================================================
   LOAD NOTES
===================================================== */

async function loadNotes(){

    try{

        /*
         * Load current topic.
         */

        const topicRef =
            db
                .collection("courses")
                .doc(courseId)
                .collection("chapters")
                .doc(chapterId)
                .collection("topics")
                .doc(topicId);


        const topicSnapshot =
            await topicRef.get();


        if(
            !topicSnapshot.exists
        ){

            showError(
                "এই topic পাওয়া যায়নি।"
            );

            return;

        }


        topicData =
            topicSnapshot.data() || {};


        /*
         * Notes URL compatibility.
         */

        notesUrl =
            topicData.notesUrl ||
            topicData.notesURL ||
            topicData.pdfUrl ||
            topicData.pdfURL ||
            topicData.notes ||
            topicData.pdf ||
            "";


        /*
         * Load all topics for
         * Previous / Next.
         */

        const topicsSnapshot =
            await db
                .collection("courses")
                .doc(courseId)
                .collection("chapters")
                .doc(chapterId)
                .collection("topics")
                .get();


        topicList = [];


        topicsSnapshot.forEach(
            function(doc){

                topicList.push({

                    id:doc.id,

                    ...doc.data()

                });

            }
        );


        currentTopicIndex =
            topicList.findIndex(
                function(topic){

                    return (
                        topic.id ===
                        topicId
                    );

                }
            );


        if(
            currentTopicIndex < 0
        ){

            currentTopicIndex = 0;

        }


        renderNotes();

        await loadReadStatus();

    }catch(error){

        console.error(
            "Notes error:",
            error
        );

        showError(
            "Notes load করতে সমস্যা হয়েছে।"
        );

    }

}


/* =====================================================
   RENDER NOTES
===================================================== */

function renderNotes(){

    const title =
        topicData.title ||
        topicData.name ||
        localStorage.getItem(
            "activeTopic"
        ) ||
        "Biology Notes";


    document
        .getElementById(
            "pageTitle"
        )
        .textContent =
            title;


    const main =
        document.getElementById(
            "mainContent"
        );


    if(!notesUrl){

        main.innerHTML =

            `

            <section class="error-box">

                <div class="error-icon">
                    📄
                </div>

                <h3>
                    Notes not available
                </h3>

                <p>
                    এই topic-এর Notes PDF এখনো upload করা হয়নি।
                </p>

                <button
                    class="error-button"
                    onclick="goCourse()"
                >
                    Back to Course
                </button>

            </section>

            `;


        document
            .getElementById(
                "openButton"
            )
            .style.display =
                "none";


        return;

    }


    main.innerHTML =

        `

        <!-- INFO -->

        <section class="info-card">

            <div class="info-top">

                <div class="info-heading">

                    <h2>
                        ${escapeHtml(title)}
                    </h2>

                    <p>
                        Read the topic notes carefully
                        and mark the topic as completed.
                    </p>

                </div>

                <div
                    id="readBadge"
                    class="read-badge"
                >
                    Not Read
                </div>

            </div>


            <div class="progress-wrap">

                <div class="progress-label">

                    <span>
                        Reading Progress
                    </span>

                    <span id="progressPercent">
                        0%
                    </span>

                </div>

                <div class="progress-track">

                    <div
                        id="progressFill"
                        class="progress-fill"
                    ></div>

                </div>

            </div>

        </section>


        <!-- PDF -->

        <section class="pdf-card">

            <div class="pdf-toolbar">

                <div
                    id="pdfStatus"
                    class="pdf-status"
                >
                    Notes PDF
                </div>


                <div class="pdf-buttons">

                    <button
                        id="newTabButton"
                        class="pdf-btn"
                    >
                        ↗ Open
                    </button>

                </div>

            </div>


            <div
                id="pdfViewer"
                class="pdf-viewer"
            >

                <iframe
                    id="pdfFrame"
                    src="${escapeAttribute(notesUrl)}"
                    title="Notes PDF"
                    loading="lazy"
                ></iframe>

            </div>


            <div
                id="pdfFallback"
                class="pdf-fallback"
            >

                <div class="pdf-fallback-icon">
                    📄
                </div>

                <h3>
                    PDF Viewer unavailable
                </h3>

                <p>
                    আপনার browser-এর ভিতরে PDF দেখা না গেলে
                    নিচের button দিয়ে PDF open করুন।
                </p>

                <a
                    id="fallbackLink"
                    class="open-pdf"
                    href="${escapeAttribute(notesUrl)}"
                    target="_blank"
                    rel="noopener"
                >
                    Open Notes PDF
                </a>

            </div>

        </section>


        <!-- MARK READ -->

        <section class="read-card">

            <div class="read-row">

                <div class="read-text">

                    <strong>
                        Complete this topic
                    </strong>

                    <span>
                        Notes পড়া শেষ হলে Mark as Read চাপুন।
                    </span>

                </div>


                <button
                    id="markRead"
                    class="mark-read"
                >
                    Mark as Read
                </button>

            </div>

        </section>


        <!-- NAVIGATION -->

        <section class="navigation">

            <button
                id="previousButton"
                class="nav-btn previous"
            >
                ← Previous Topic
            </button>


            <button
                id="nextButton"
                class="nav-btn next"
            >
                Next Topic →
            </button>

        </section>

        `;


    document
        .getElementById(
            "openButton"
        )
        .style.display =
            "block";


    document
        .getElementById(
            "openButton"
        )
        .onclick =
            openPDF;


    document
        .getElementById(
            "newTabButton"
        )
        .onclick =
            openPDF;


    document
        .getElementById(
            "markRead"
        )
        .onclick =
            markAsRead;


    document
        .getElementById(
            "previousButton"
        )
        .onclick =
            previousTopic;


    document
        .getElementById(
            "nextButton"
        )
        .onclick =
            nextTopic;


    updateNavigationButtons();


    /*
     * Detect PDF iframe errors.
     */

    const frame =
        document.getElementById(
            "pdfFrame"
        );


    if(frame){

        frame.addEventListener(
            "error",
            function(){

                showPdfFallback();

            }
        );

    }

}


/* =====================================================
   PDF OPEN
===================================================== */

function openPDF(){

    if(!notesUrl){

        showToast(
            "Notes PDF পাওয়া যায়নি।"
        );

        return;

    }


    window.open(
        notesUrl,
        "_blank",
        "noopener"
    );

}


/* =====================================================
   PDF FALLBACK
===================================================== */

function showPdfFallback(){

    const viewer =
        document.getElementById(
            "pdfViewer"
        );

    const fallback =
        document.getElementById(
            "pdfFallback"
        );


    if(viewer){

        viewer.style.display =
            "none";

    }


    if(fallback){

        fallback.style.display =
            "block";

    }

}


/* =====================================================
   READ STATUS
===================================================== */

async function loadReadStatus(){

    try{

        const ref =
            db
                .collection("users")
                .doc(currentUser.uid)
                .collection("courses")
                .doc(courseId)
                .collection("topics")
                .doc(topicId);


        const snapshot =
            await ref.get();


        if(
            snapshot.exists
        ){

            const data =
                snapshot.data() || {};


            if(
                data.notesCompleted === true
            ){

                setReadUI(true);

            }else{

                setReadUI(false);

            }

        }else{

            setReadUI(false);

        }

    }catch(error){

        console.log(
            "Read status:",
            error
        );

        setReadUI(false);

    }

}


/* =====================================================
   MARK AS READ
===================================================== */

async function markAsRead(){

    try{

        await db
            .collection("users")
            .doc(currentUser.uid)
            .collection("courses")
            .doc(courseId)
            .collection("topics")
            .doc(topicId)
            .set({

                notesCompleted:true,

                notesCompletedAt:
                    firebase.firestore
                        .FieldValue
                        .serverTimestamp()

            },{
                merge:true
            });


        setReadUI(true);


        showToast(
            "Notes completed ✓"
        );


    }catch(error){

        console.error(
            "Mark read error:",
            error
        );


        showToast(
            "Progress save হয়নি। Firebase rules check করুন।"
        );

    }

}


/* =====================================================
   SET READ UI
===================================================== */

function setReadUI(
    completed
){

    const button =
        document.getElementById(
            "markRead"
        );


    const badge =
        document.getElementById(
            "readBadge"
        );


    const percent =
        document.getElementById(
            "progressPercent"
        );


    const fill =
        document.getElementById(
            "progressFill"
        );


    if(!button){

        return;

    }


    if(completed){

        button.textContent =
            "✓ Completed";

        button.classList.add(
            "completed"
        );


        if(badge){

            badge.textContent =
                "Completed";

        }


        if(percent){

            percent.textContent =
                "100%";

        }


        if(fill){

            fill.style.width =
                "100%";

        }

    }else{

        button.textContent =
            "Mark as Read";

        button.classList.remove(
            "completed"
        );


        if(badge){

            badge.textContent =
                "Not Read";

        }


        if(percent){

            percent.textContent =
                "0%";

        }


        if(fill){

            fill.style.width =
                "0%";

        }

    }

}


/* =====================================================
   PREVIOUS TOPIC
===================================================== */

function previousTopic(){

    if(
        currentTopicIndex <= 0
    ){

        showToast(
            "এটাই প্রথম topic।"
        );

        return;

    }


    const previous =
        topicList[
            currentTopicIndex - 1
        ];


    if(!previous){

        return;

    }


    openTopic(
        previous
    );

}


/* =====================================================
   NEXT TOPIC
===================================================== */

function nextTopic(){

    if(
        currentTopicIndex >=
        topicList.length - 1
    ){

        showToast(
            "এটাই শেষ topic।"
        );

        return;

    }


    const next =
        topicList[
            currentTopicIndex + 1
        ];


    if(!next){

        return;

    }


    openTopic(
        next
    );

}


/* =====================================================
   OPEN TOPIC
===================================================== */

function openTopic(
    topic
){

    localStorage.setItem(
        "activeTopic",
        topic.id
    );


    /*
     * Notes page reloads and
     * loads the new topic PDF.
     */

    window.location.href =
        "notes.html";

}


/* =====================================================
   NAVIGATION BUTTON STATE
===================================================== */

function updateNavigationButtons(){

    const previous =
        document.getElementById(
            "previousButton"
        );

    const next =
        document.getElementById(
            "nextButton"
        );


    if(previous){

        previous.disabled =
            currentTopicIndex <= 0;

    }


    if(next){

        next.disabled =
            currentTopicIndex >=
            topicList.length - 1;

    }

}


/* =====================================================
   BACK
===================================================== */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function(){

            goCourse();

        }
    );


function goCourse(){

    window.location.href =
        "course.html";

}


/* =====================================================
   ERROR
===================================================== */

function showError(
    message
){

    document
        .getElementById(
            "mainContent"
        )
        .innerHTML =

        `

        <section class="error-box">

            <div class="error-icon">
                ⚠️
            </div>

            <h3>
                Notes unavailable
            </h3>

            <p>
                ${escapeHtml(message)}
            </p>

            <button
                class="error-button"
                onclick="goCourse()"
            >
                Back to Course
            </button>

        </section>

        `;


    document
        .getElementById(
            "openButton"
        )
        .style.display =
            "none";

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer = null;


function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =====================================================
   SECURITY HELPERS
===================================================== */

function escapeHtml(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>
