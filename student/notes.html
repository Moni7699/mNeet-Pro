<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146c43"><title>Notes | mNEET-Pro</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script></head><body><header><a class="brand" href="dashboard.html">mNEET-Pro</a><div><a href="profile.html">Profile</a> <button class="secondary" data-logout>Logout</button></div></header><div id="message" class="message" hidden></div><main class="wrap"><a id="back" href="courses.html">← Back</a><h1 id="title">Notes</h1><section class="card" id="viewer">Loading PDF…</section></main><nav class="bottom-nav"><a href="dashboard.html">Dashboard</a><a href="courses.html">Courses</a><a href="profile.html">Profile</a><a href="notifications.html">Notifications</a></nav><script>(async()=>{try{let u=await MN.requireUser(),courseId=MN.getParam('courseId'),chapterId=MN.getParam('chapterId'),topicId=MN.getParam('topicId');if(!await MN.purchaseApproved(u.uid,courseId)){MN.msg('Course access locked.',true);return}let d=await db.collection('courses').doc(courseId).collection('chapters').doc(chapterId).collection('topics').doc(topicId).get(),t=d.data()||{};$('#title').textContent=(t.title||'Topic')+' — Notes';$('#back').href='topic.html?courseId='+encodeURIComponent(courseId)+'&chapterId='+encodeURIComponent(chapterId)+'&topicId='+encodeURIComponent(topicId);let url=t.notesUrl||t.pdfUrl||'';$('#viewer').innerHTML=url?'<iframe class="pdf" title="Topic notes PDF" src="'+MN.esc(url)+'"></iframe><p><a class="btn secondary" target="_blank" rel="noopener" href="'+MN.esc(url)+'">Open PDF in new tab</a></p>':'<div class="empty">Notes PDF has not been added by the teacher yet.</div>'}catch(e){}})();</script></body></html>
