<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146c43"><title>Quiz | mNEET-Pro</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script></head><body><header><a class="brand" href="dashboard.html">mNEET-Pro</a><div><a href="profile.html">Profile</a> <button class="secondary" data-logout>Logout</button></div></header><div id="message" class="message" hidden></div><main class="wrap"><div class="row"><a id="back" href="courses.html">← Back</a><div>Question <b id="counter">0/0</b> · <span class="timer" id="timer">60s</span></div></div><section class="card"><h1 id="question">Loading quiz…</h1><div id="options"></div><div class="row" style="margin-top:18px"><button class="secondary" id="prev">Previous</button><button class="secondary" id="submitAnswer">Answer Submit</button><button id="next">Next</button></div><p id="feedback" class="muted"></p><button id="finish" class="full">Submit Quiz</button></section></main><nav class="bottom-nav"><a href="dashboard.html">Dashboard</a><a href="courses.html">Courses</a><a href="profile.html">Profile</a><a href="notifications.html">Notifications</a></nav><script>
(async()=>{let timer=null,questions=[],answers={},submitted={},idx=0,left=60,courseId,quizDocId,uid;try{let u=await MN.requireUser();uid=u.uid;courseId=MN.getParam('courseId');let chapterId=MN.getParam('chapterId'),topicId=MN.getParam('topicId');if(!await MN.purchaseApproved(uid,courseId)){MN.msg('Course access locked.',true);return}let topic=await db.collection('courses').doc(courseId).collection('chapters').doc(chapterId).collection('topics').doc(topicId).get(),t=topic.data()||{};quizDocId=t.quizId||topicId;let qref=db.collection('courses').doc(courseId).collection('quizzes').doc(quizDocId),qdoc=await qref.get();if(!qdoc.exists){let sub=await db.collection('courses').doc(courseId).collection('chapters').doc(chapterId).collection('topics').doc(topicId).collection('quizzes').limit(1).get();if(sub.size){questions=(sub.docs[0].data().questions||[])}else{throw new Error('Quiz not published yet. Add quiz document in courses/{courseId}/quizzes/{quizId}.')}}else questions=qdoc.data().questions||[];if(!questions.length)throw new Error('This quiz has no questions yet.');$('#back').href='topic.html?courseId='+encodeURIComponent(courseId)+'&chapterId='+encodeURIComponent(chapterId)+'&topicId='+encodeURIComponent(topicId);let key='mnquiz_'+uid+'_'+courseId+'_'+quizDocId,old=JSON.parse(localStorage.getItem(key)||'null');if(old&&old.questionsLength===questions.length){answers=old.answers||{};submitted=old.submitted||{};idx=Math.min(old.idx||0,questions.length-1);left=old.left||60}function save(){localStorage.setItem(key,JSON.stringify({questionsLength:questions.length,answers,submitted,idx,left}))}function render(){let q=questions[idx];$('#counter').textContent=(idx+1)+'/'+questions.length;$('#question').textContent=q.question||('Question '+(idx+1));$('#options').innerHTML='';(q.options||[]).forEach((op,i)=>{let lab=document.createElement('label');lab.className='option';if(submitted[idx]){if(i===Number(q.answer))lab.classList.add('correct');if(Number(answers[idx])===i&&i!==Number(q.answer))lab.classList.add('wrong')}lab.innerHTML='<input type="radio" name="opt" value="'+i+'" '+(Number(answers[idx])===i?'checked':'')+' '+(submitted[idx]?'disabled':'')+'> '+MN.esc(op);lab.querySelector('input').onchange=e=>{answers[idx]=Number(e.target.value);save()};$('#options').append(lab)});$('#feedback').textContent=submitted[idx]?(Number(answers[idx])===Number(q.answer)?'Correct!':('Correct answer: '+(q.options||[])[Number(q.answer)]+(q.explanation?' — '+q.explanation:''))):'';$('#prev').disabled=idx===0;$('#next').disabled=idx===questions.length-1;save()}function stop(){if(timer)clearInterval(timer);timer=null}function advance(){if(idx<questions.length-1){idx++;left=60;render()}else finish()}function finish(){stop();let correct=0,wrong=0,skipped=0;questions.forEach((q,i)=>{if(answers[i]===undefined)skipped++;else if(Number(answers[i])===Number(q.answer))correct++;else wrong++});let result={courseId,quizId:quizDocId,total:questions.length,correct,wrong,skipped,score:correct*4-wrong,accuracy:questions.length?Math.round(correct/questions.length*100):0,answers,questions:questions.map(q=>({question:q.question,options:q.options,answer:q.answer,explanation:q.explanation})),finishedAt:Date.now()};localStorage.setItem('mnlastresult',JSON.stringify(result));db.collection('quizAttempts').add({uid,courseId,quizId:quizDocId,total:result.total,correct,wrong,skipped,score:result.score,accuracy:result.accuracy,createdAt:firebase.firestore.FieldValue.serverTimestamp()}).catch(()=>{});localStorage.removeItem(key);MN.go('result.html')}$('#submitAnswer').onclick=()=>{submitted[idx]=true;render()};$('#prev').onclick=()=>{if(idx>0){idx--;left=60;render()}};$('#next').onclick=advance;$('#finish').onclick=()=>{if(confirm('Submit this quiz and view result?'))finish()};render();timer=setInterval(()=>{left--;$('#timer').textContent=left+'s';save();if(left<=0){if(!submitted[idx])submitted[idx]=true;advance()}},1000);$('#timer').textContent=left+'s'}catch(e){MN.msg(e.message||'Could not load quiz.',true);$('#question').textContent='Quiz unavailable';$('#options').innerHTML=''}})();
</script></body></html>
