<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146c43"><title>Dashboard | mNEET-Pro</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script></head><body><header><a class="brand" href="dashboard.html">mNEET-Pro</a><div><a href="profile.html">Profile</a> <button class="secondary" data-logout>Logout</button></div></header><div id="message" class="message" hidden></div><main class="wrap"><h1 id="hello">Student dashboard</h1><p class="muted">Your Biology learning at a glance.</p><section class="grid"><article class="card"><span class="muted">Available courses</span><h2 id="courseCount">—</h2><a class="btn" href="courses.html">Browse courses</a></article><article class="card"><span class="muted">Approved purchases</span><h2 id="purchaseCount">—</h2><a class="btn secondary" href="courses.html">My learning</a></article></section><section class="card"><div class="row"><h2>Continue learning</h2><a href="courses.html">View all</a></div><div id="courseList" class="empty">Loading courses…</div></section></main><nav class="bottom-nav"><a href="dashboard.html">Dashboard</a><a href="courses.html">Courses</a><a href="profile.html">Profile</a><a href="notifications.html">Notifications</a></nav><script> (async()=>{try{let u=await MN.requireUser();$('#hello').textContent='Hello, '+(u.displayName||u.email.split('@')[0]);let [cs,ps]=await Promise.all([db.collection('courses').where('active','==',true).get(),db.collection('purchases').where('uid','==',u.uid).where('status','==','approved').get()]);$('#courseCount').textContent=cs.size;$('#purchaseCount').textContent=ps.size;let box=$('#courseList');if(!cs.size){box.textContent='No courses published yet.';return}box.className='';box.innerHTML='';cs.docs.forEach(d=>{let c=d.data();let el=document.createElement('div');el.className='list-item';el.innerHTML='<div><b>'+MN.esc(c.title||'Biology course')+'</b><div class="muted">'+MN.esc(c.description||'NEET Biology')+'</div></div><a class="btn" href="course.html?id='+encodeURIComponent(d.id)+'">Open</a>';box.append(el)})}catch(e){}})();</script></body></html>
