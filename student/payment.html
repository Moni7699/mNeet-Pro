<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146c43"><title>Payment | mNEET-Pro</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script></head><body><header><a class="brand" href="dashboard.html">mNEET-Pro</a><div><a href="profile.html">Profile</a> <button class="secondary" data-logout>Logout</button></div></header><div id="message" class="message" hidden></div><main class="wrap narrow"><a id="back" href="courses.html">← Back to courses</a><section class="card"><h1>Manual payment request</h1><p class="muted">Pay using the official UPI details shown below. Do not share your UPI PIN or OTP. Access remains locked until admin approves.</p><div id="paymentInfo">Loading payment details…</div><form id="paymentForm"><label>UPI transaction reference / UTR</label><input name="reference" required minlength="6" maxlength="100" autocomplete="off"><label>Optional note</label><textarea name="note" rows="2" maxlength="300"></textarea><button class="full">Submit for admin review</button></form></section></main><nav class="bottom-nav"><a href="dashboard.html">Dashboard</a><a href="courses.html">Courses</a><a href="profile.html">Profile</a><a href="notifications.html">Notifications</a></nav><script>(async()=>{try{let u=await MN.requireUser(),courseId=MN.getParam('courseId');if(!courseId){MN.go('courses.html');return}let c=await db.collection('courses').doc(courseId).get();if(!c.exists){MN.go('courses.html');return}$('#back').href='course.html?id='+encodeURIComponent(courseId);let s=await MN.loadSettings();$('#paymentInfo').innerHTML='<h2>'+MN.esc(c.data().title||'Course')+'</h2><p>Amount: <b>'+MN.money(c.data().price)+'</b></p>'+(s.upiId?'<p>UPI ID: <b>'+MN.esc(s.upiId)+'</b></p>':'<p class="muted">UPI details have not been configured. Contact admin.</p>')+(s.qrUrl?'<img class="qr" alt="Payment QR code" src="'+MN.esc(s.qrUrl)+'">':'')+'<p>'+MN.esc(s.instructions||'After payment, enter the UTR/reference number below.')+'</p>';if(await MN.purchaseApproved(u.uid,courseId)){MN.msg('This course is already approved.');$('#paymentForm').classList.add('hidden')}$('#paymentForm').addEventListener('submit',async e=>{e.preventDefault();let f=e.currentTarget;try{await db.collection('paymentRequests').add({uid:u.uid,email:u.email||'',courseId,courseTitle:c.data().title||'',amount:Number(c.data().price||0),reference:f.reference.value.trim(),note:f.note.value.trim(),status:'pending',createdAt:firebase.firestore.FieldValue.serverTimestamp()});MN.msg('Request submitted. Admin approval is required; access is not unlocked yet.');f.reset();f.classList.add('hidden')}catch(err){MN.msg('Submit failed: '+err.message,true)}})}catch(e){}})();</script></body></html>
