<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0f6b3c"
    >

    <title>mNEET-Pro | Student Login</title>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #e8f5e9 0%,
                    #f5f8f6 50%,
                    #eaf4ee 100%
                );

            color: #17221a;
        }

        .page {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        /* =========================
           BRAND
        ========================= */

        .brand {
            text-align: center;
            margin-bottom: 22px;
        }

        .logo {
            width: 72px;
            height: 72px;

            margin: 0 auto 12px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #0b572f,
                    #16804a
                );

            color: white;

            font-size: 32px;
            font-weight: 900;

            box-shadow:
                0 12px 28px
                rgba(11, 87, 47, 0.22);
        }

        .brand h1 {
            font-size: 28px;
            font-weight: 900;
            color: #0d6035;
        }

        .brand p {
            margin-top: 6px;

            font-size: 12px;
            color: #68766e;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            background: white;

            border: 1px solid #dfe8e1;

            border-radius: 24px;

            padding: 26px;

            box-shadow:
                0 18px 45px
                rgba(0, 0, 0, 0.09);
        }

        .heading h2 {
            font-size: 22px;
            color: #17221a;
        }

        .heading p {
            margin-top: 6px;
            margin-bottom: 22px;

            font-size: 12px;
            color: #758078;
        }

        /* =========================
           MESSAGE
        ========================= */

        #message {
            display: none;

            padding: 12px 13px;

            margin-bottom: 16px;

            border-radius: 11px;

            font-size: 12px;
            line-height: 1.5;

            font-weight: 700;
        }

        #message.error {
            display: block;

            color: #a52121;
            background: #ffebee;

            border: 1px solid #ffcdd2;
        }

        #message.success {
            display: block;

            color: #176b35;
            background: #e8f5e9;

            border: 1px solid #c8e6c9;
        }

        /* =========================
           INPUT
        ========================= */

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;

            margin-bottom: 7px;

            font-size: 12px;
            font-weight: 800;

            color: #34443a;
        }

        .input {
            width: 100%;
            height: 48px;

            padding: 0 14px;

            border: 1px solid #d5ded8;

            border-radius: 12px;

            background: #fbfcfb;

            outline: none;

            font-size: 14px;

            color: #17221a;
        }

        .input:focus {
            border-color: #16804a;

            background: white;

            box-shadow:
                0 0 0 3px
                rgba(22, 128, 74, 0.10);
        }

        /* =========================
           PASSWORD
        ========================= */

        .password-wrap {
            position: relative;
        }

        .password-wrap .input {
            padding-right: 52px;
        }

        .eye {
            position: absolute;

            right: 7px;
            top: 6px;

            width: 36px;
            height: 36px;

            border: 0;

            background: transparent;

            cursor: pointer;

            font-size: 17px;
        }

        /* =========================
           FORGOT
        ========================= */

        .forgot-row {
            display: flex;
            justify-content: flex-end;

            margin-top: -2px;
            margin-bottom: 18px;
        }

        .forgot {
            border: 0;

            background: transparent;

            color: #16804a;

            font-size: 12px;
            font-weight: 800;

            cursor: pointer;
        }

        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {
            width: 100%;
            height: 49px;

            border: 0;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #0d6035,
                    #198754
                );

            color: white;

            font-size: 14px;
            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 8px 18px
                rgba(13, 96, 53, 0.20);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .login-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            margin-right: 6px;
        }

        /* =========================
           DIVIDER
        ========================= */

        .divider {
            display: flex;
            align-items: center;

            gap: 10px;

            margin: 22px 0;

            color: #9aa49e;

            font-size: 10px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #e2e8e3;
        }

        /* =========================
           SIGNUP
        ========================= */

        .signup-btn {
            width: 100%;
            height: 47px;

            border: 1px solid #16804a;

            border-radius: 13px;

            background: white;

            color: #0d6035;

            font-size: 13px;
            font-weight: 900;

            cursor: pointer;
        }

        .signup-btn:active {
            transform: scale(0.98);
        }

        /* =========================
           FOOTER
        ========================= */

        .footer {
            text-align: center;

            margin-top: 17px;

            font-size: 10px;

            line-height: 1.6;

            color: #7c8780;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 480px) {

            .page {
                padding: 15px;
            }

            .card {
                padding: 21px;
                border-radius: 21px;
            }

            .brand h1 {
                font-size: 25px;
            }

            .logo {
                width: 66px;
                height: 66px;
                border-radius: 19px;
            }
        }

    </style>
</head>

<body>

<div class="page">

    <div class="container">

        <!-- =====================
             BRAND
        ====================== -->

        <div class="brand">

            <div class="logo">
                M
            </div>

            <h1>
                mNEET-Pro
            </h1>

            <p>
                NEET Biology Learning Platform
            </p>

        </div>


        <!-- =====================
             LOGIN CARD
        ====================== -->

        <div class="card">

            <div class="heading">

                <h2>
                    Student Login
                </h2>

                <p>
                    Login to continue your preparation
                </p>

            </div>


            <!-- MESSAGE -->

            <div id="message"></div>


            <!-- EMAIL -->

            <div class="field">

                <label for="email">
                    Email Address
                </label>

                <input
                    class="input"
                    id="email"
                    type="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="field">

                <label for="password">
                    Password
                </label>

                <div class="password-wrap">

                    <input
                        class="input"
                        id="password"
                        type="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        class="eye"
                        id="eye"
                        aria-label="Show password"
                    >
                        👁️
                    </button>

                </div>

            </div>


            <!-- FORGOT -->

            <div class="forgot-row">

                <button
                    type="button"
                    class="forgot"
                    id="forgot"
                >
                    Forgot Password?
                </button>

            </div>


            <!-- LOGIN -->

            <button
                type="button"
                class="login-btn"
                id="login"
            >

                <span
                    id="loading"
                    class="loading"
                >
                    ⏳
                </span>

                <span id="loginText">
                    Login
                </span>

            </button>


            <!-- DIVIDER -->

            <div class="divider">
                New student?
            </div>


            <!-- SIGN UP -->

            <button
                type="button"
                class="signup-btn"
                id="signup"
            >
                Create Student Account
            </button>

        </div>


        <div class="footer">

            mNEET-Pro • Student Learning Platform

            <br>

            Secure Firebase Authentication

        </div>

    </div>

</div>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyApQOM_mtFZ16RiNJEaIUhb4iYFBIBRK58",

    authDomain:
        "mneet-spark.firebaseapp.com",

    databaseURL:
        "https://mneet-spark-default-rtdb.firebaseio.com",

    projectId:
        "mneet-spark",

    storageBucket:
        "mneet-spark.firebasestorage.app",

    messagingSenderId:
        "252201633700",

    appId:
        "1:252201633700:web:1a1e7a2cff1f0b168ea331"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

if (!firebase.apps.length) {

    firebase.initializeApp(
        firebaseConfig
    );

}

const auth =
    firebase.auth();


/* =====================================================
   ELEMENTS
===================================================== */

const email =
    document.getElementById("email");

const password =
    document.getElementById("password");

const login =
    document.getElementById("login");

const signup =
    document.getElementById("signup");

const forgot =
    document.getElementById("forgot");

const eye =
    document.getElementById("eye");

const message =
    document.getElementById("message");

const loading =
    document.getElementById("loading");

const loginText =
    document.getElementById("loginText");


/* =====================================================
   MESSAGE FUNCTION
===================================================== */

function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className = type;

}


/* =====================================================
   FIREBASE ERROR
===================================================== */

function getErrorMessage(error) {

    switch (error.code) {

        case "auth/invalid-email":
            return "Email addressটি সঠিক নয়।";

        case "auth/user-not-found":
            return "এই email দিয়ে কোনো account পাওয়া যায়নি।";

        case "auth/wrong-password":
            return "Password সঠিক নয়।";

        case "auth/invalid-credential":
            return "Email অথবা password সঠিক নয়।";

        case "auth/user-disabled":
            return "এই account disabled করা হয়েছে।";

        case "auth/too-many-requests":
            return "অনেকবার চেষ্টা করা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।";

        case "auth/network-request-failed":
            return "Internet connection check করুন।";

        default:
            return "Login করা যায়নি। আবার চেষ্টা করুন।";
    }

}


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

eye.addEventListener(
    "click",
    function () {

        if (
            password.type === "password"
        ) {

            password.type = "text";

            eye.textContent = "🙈";

        } else {

            password.type = "password";

            eye.textContent = "👁️";

        }

    }
);


/* =====================================================
   LOGIN
===================================================== */

login.addEventListener(
    "click",
    loginStudent
);


async function loginStudent() {

    const emailValue =
        email.value.trim();

    const passwordValue =
        password.value;


    /* VALIDATION */

    if (!emailValue) {

        showMessage(
            "Email address দিন।",
            "error"
        );

        email.focus();

        return;
    }


    if (!passwordValue) {

        showMessage(
            "Password দিন।",
            "error"
        );

        password.focus();

        return;
    }


    /* LOADING */

    login.disabled = true;

    loading.style.display = "inline";

    loginText.textContent =
        "Logging in...";


    try {

        await auth.signInWithEmailAndPassword(
            emailValue,
            passwordValue
        );


        showMessage(
            "Login successful. Dashboard খুলছে...",
            "success"
        );


        setTimeout(
            function () {

                window.location.href =
                    "dashboard.html";

            },
            600
        );


    } catch (error) {

        console.error(
            "Login Error:",
            error
        );


        showMessage(
            getErrorMessage(error),
            "error"
        );


        login.disabled = false;

        loading.style.display = "none";

        loginText.textContent =
            "Login";

    }

}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

forgot.addEventListener(
    "click",
    async function () {

        const emailValue =
            email.value.trim();


        if (!emailValue) {

            showMessage(
                "প্রথমে email address দিন।",
                "error"
            );

            email.focus();

            return;
        }


        try {

            await auth.sendPasswordResetEmail(
                emailValue
            );


            showMessage(
                "Password reset email পাঠানো হয়েছে। আপনার inbox check করুন।",
                "success"
            );


        } catch (error) {

            console.error(
                "Reset Error:",
                error
            );


            showMessage(
                getErrorMessage(error),
                "error"
            );

        }

    }
);


/* =====================================================
   CREATE ACCOUNT
===================================================== */

signup.addEventListener(
    "click",
    function () {

        window.location.href =
            "signup.html";

    }
);


/* =====================================================
   ENTER KEY
===================================================== */

email.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            password.focus();

        }

    }
);


password.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "Enter"
        ) {

            loginStudent();

        }

    }
);


/* =====================================================
   CHECK EXISTING LOGIN
===================================================== */

auth.onAuthStateChanged(
    function (user) {

        if (user) {

            window.location.href =
                "dashboard.html";

        }

    }
);

</script>

</body>
</html>
