<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146c43"><title>Login | mNEET-Pro</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script></head><body><header><span class="brand">mNEET-Pro</span></header><main class="wrap narrow"><section class="card"><h1>Welcome back</h1><p class="muted">Sign in to continue your NEET Biology practice.</p><form id="login"><label>Email</label><input name="email" type="email" autocomplete="email" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required minlength="6"><button class="full" type="submit">Login</button></form><p><a href="signup.html">Create student account</a></p><p><a href="#" id="reset">Forgot password?</a></p></section></main><script>
const {msg,go}=MN; auth.onAuthStateChanged(u=>{if(u)location.href='dashboard.html'});
document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();let f=e.currentTarget;try{await auth.signInWithEmailAndPassword(f.email.value.trim(),f.password.value);location.href='dashboard.html'}catch(err){msg(err.message,true)}});
document.querySelector('#reset').addEventListener('click',async e=>{e.preventDefault();let email=document.querySelector('[name=email]').value.trim();if(!email){msg('Age email field-e email likhun.',true);return}try{await auth.sendPasswordResetEmail(email);msg('Password reset email pathano hoyeche. Inbox check korun.')}catch(err){msg(err.message,true)}});
</script></body></html>
