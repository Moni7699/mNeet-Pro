<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#0f6b3c"
>

<title>mNEET-Pro | Create Account</title>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* =====================================================
   BODY
===================================================== */

body{

    min-height:100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        linear-gradient(
            135deg,
            #e8f5e9,
            #f5f8f6,
            #eaf4ee
        );

    color:#17221a;

}


/* =====================================================
   PAGE
===================================================== */

.page{

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    padding:20px;

}


.container{

    width:100%;

    max-width:450px;

}


/* =====================================================
   BRAND
===================================================== */

.brand{

    text-align:center;

    margin-bottom:20px;

}


.logo{

    width:68px;

    height:68px;

    margin:0 auto 11px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:20px;

    background:
        linear-gradient(
            135deg,
            #0b572f,
            #16804a
        );

    color:white;

    font-size:30px;

    font-weight:900;

    box-shadow:
        0 12px 28px
        rgba(11,87,47,.22);

}


.brand h1{

    font-size:27px;

    font-weight:900;

    color:#0d6035;

}


.brand p{

    margin-top:6px;

    font-size:12px;

    color:#68766e;

}


/* =====================================================
   CARD
===================================================== */

.card{

    background:#fff;

    border:1px solid #dfe8e1;

    border-radius:23px;

    padding:25px;

    box-shadow:
        0 18px 45px
        rgba(0,0,0,.09);

}


.heading h2{

    font-size:21px;

    color:#17221a;

}


.heading p{

    margin-top:6px;

    margin-bottom:20px;

    font-size:12px;

    color:#758078;

}


/* =====================================================
   MESSAGE
===================================================== */

#message{

    display:none;

    padding:12px 13px;

    margin-bottom:15px;

    border-radius:11px;

    font-size:12px;

    line-height:1.5;

    font-weight:700;

}


#message.error{

    display:block;

    background:#ffebee;

    color:#a52121;

    border:1px solid #ffcdd2;

}


#message.success{

    display:block;

    background:#e8f5e9;

    color:#176b35;

    border:1px solid #c8e6c9;

}


/* =====================================================
   FIELD
===================================================== */

.field{

    margin-bottom:15px;

}


.field label{

    display:block;

    margin-bottom:7px;

    font-size:12px;

    font-weight:800;

    color:#34443a;

}


.input{

    width:100%;

    height:47px;

    padding:0 13px;

    border:1px solid #d5ded8;

    border-radius:12px;

    background:#fbfcfb;

    outline:none;

    font-size:14px;

    color:#17221a;

}


.input:focus{

    border-color:#16804a;

    background:#fff;

    box-shadow:
        0 0 0 3px
        rgba(22,128,74,.10);

}


/* =====================================================
   PASSWORD
===================================================== */

.password-box{

    position:relative;

}


.password-box .input{

    padding-right:50px;

}


.eye{

    position:absolute;

    right:7px;

    top:6px;

    width:36px;

    height:36px;

    border:0;

    background:transparent;

    cursor:pointer;

    font-size:17px;

}


/* =====================================================
   CREATE BUTTON
===================================================== */

.create-btn{

    width:100%;

    height:49px;

    border:0;

    border-radius:13px;

    background:
        linear-gradient(
            135deg,
            #0d6035,
            #198754
        );

    color:#fff;

    font-size:14px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 18px
        rgba(13,96,53,.20);

}


.create-btn:active{

    transform:scale(.98);

}


.create-btn:disabled{

    opacity:.65;

    cursor:not-allowed;

}


.loading{

    display:none;

    margin-right:6px;

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.login-btn{

    width:100%;

    height:46px;

    margin-top:15px;

    border:1px solid #16804a;

    border-radius:13px;

    background:#fff;

    color:#0d6035;

    font-size:13px;

    font-weight:900;

    cursor:pointer;

}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    text-align:center;

    margin-top:17px;

    color:#7c8780;

    font-size:10px;

    line-height:1.6;

}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:480px){

    .page{

        padding:15px;

    }

    .card{

        padding:20px;

        border-radius:21px;

    }

    .brand h1{

        font-size:25px;

    }

}

</style>

</head>


<body>


<div class="page">

<div class="container">


<!-- =====================================================
     BRAND
===================================================== -->

<div class="brand">

    <div class="logo">
        M
    </div>

    <h1>
        mNEET-Pro
    </h1>

    <p>
        NEET Biology Learning Platform
    </p>

</div>


<!-- =====================================================
     CARD
===================================================== -->

<div class="card">


<div class="heading">

    <h2>
        Create Student Account
    </h2>

    <p>
        Create your account and start your NEET preparation
    </p>

</div>


<!-- MESSAGE -->

<div id="message"></div>


<!-- =====================================================
     NAME
===================================================== -->

<div class="field">

<label for="name">
    Student Name
</label>

<input
    class="input"
    id="name"
    type="text"
    placeholder="Enter your full name"
    autocomplete="name"
>

</div>


<!-- =====================================================
     EMAIL
===================================================== -->

<div class="field">

<label for="email">
    Email Address
</label>

<input
    class="input"
    id="email"
    type="email"
    placeholder="Enter your email"
    autocomplete="email"
>

</div>


<!-- =====================================================
     PASSWORD
===================================================== -->

<div class="field">

<label for="password">
    Password
</label>

<div class="password-box">

<input
    class="input"
    id="password"
    type="password"
    placeholder="Minimum 6 characters"
    autocomplete="new-password"
>

<button
    type="button"
    class="eye"
    id="passwordEye"
>
    👁️
</button>

</div>

</div>


<!-- =====================================================
     CONFIRM PASSWORD
===================================================== -->

<div class="field">

<label for="confirmPassword">
    Confirm Password
</label>

<div class="password-box">

<input
    class="input"
    id="confirmPassword"
    type="password"
    placeholder="Re-enter your password"
    autocomplete="new-password"
>

<button
    type="button"
    class="eye"
    id="confirmEye"
>
    👁️
</button>

</div>

</div>


<!-- =====================================================
     CREATE ACCOUNT
===================================================== -->

<button
    type="button"
    class="create-btn"
    id="createButton"
>

<span
    id="loading"
    class="loading"
>
    ⏳
</span>

<span id="createText">
    Create Account
</span>

</button>


<!-- =====================================================
     LOGIN
===================================================== -->

<button
    type="button"
    class="login-btn"
    id="loginButton"
>
    Already have an account? Login
</button>


</div>


<div class="footer">

    mNEET-Pro • Student Learning Platform

    <br>

    Secure Firebase Authentication

</div>


</div>

</div>


<script>

/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
        "AIzaSyApQOM_mtFZ16RiNJEaIUhb4iYFBIBRK58",

    authDomain:
        "mneet-spark.firebaseapp.com",

    databaseURL:
        "https://mneet-spark-default-rtdb.firebaseio.com",

    projectId:
        "mneet-spark",

    storageBucket:
        "mneet-spark.firebasestorage.app",

    messagingSenderId:
        "252201633700",

    appId:
        "1:252201633700:web:1a1e7a2cff1f0b168ea331"

};


/* =====================================================
   FIREBASE INITIALIZE
===================================================== */

if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

}


const auth =
    firebase.auth();


const db =
    firebase.firestore();


/* =====================================================
   ELEMENTS
===================================================== */

const nameInput =
    document.getElementById("name");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const confirmPasswordInput =
    document.getElementById("confirmPassword");

const createButton =
    document.getElementById("createButton");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const loading =
    document.getElementById("loading");

const createText =
    document.getElementById("createText");

const passwordEye =
    document.getElementById("passwordEye");

const confirmEye =
    document.getElementById("confirmEye");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type
){

    message.textContent =
        text;

    message.className =
        type;

}


/* =====================================================
   FIREBASE ERROR
===================================================== */

function getErrorMessage(error){

    switch(error.code){

        case "auth/email-already-in-use":

            return "এই email দিয়ে ইতিমধ্যে একটি account আছে।";

        case "auth/invalid-email":

            return "Email addressটি সঠিক নয়।";

        case "auth/weak-password":

            return "Password কমপক্ষে 6 characters হতে হবে।";

        case "auth/network-request-failed":

            return "Internet connection check করুন।";

        case "auth/operation-not-allowed":

            return "Firebase Email/Password Authentication এখনো enable করা হয়নি।";

        default:

            return (
                error.message ||
                "Account তৈরি করা যায়নি। আবার চেষ্টা করুন।"
            );

    }

}


/* =====================================================
   PASSWORD TOGGLE
===================================================== */

passwordEye.addEventListener(
    "click",
    function(){

        if(
            passwordInput.type ===
            "password"
        ){

            passwordInput.type =
                "text";

            passwordEye.textContent =
                "🙈";

        }else{

            passwordInput.type =
                "password";

            passwordEye.textContent =
                "👁️";

        }

    }
);


/* =====================================================
   CONFIRM PASSWORD TOGGLE
===================================================== */

confirmEye.addEventListener(
    "click",
    function(){

        if(
            confirmPasswordInput.type ===
            "password"
        ){

            confirmPasswordInput.type =
                "text";

            confirmEye.textContent =
                "🙈";

        }else{

            confirmPasswordInput.type =
                "password";

            confirmEye.textContent =
                "👁️";

        }

    }
);


/* =====================================================
   CREATE ACCOUNT
===================================================== */

createButton.addEventListener(
    "click",
    createAccount
);


async function createAccount(){

    const name =
        nameInput.value.trim();

    const email =
        emailInput.value.trim();

    const password =
        passwordInput.value;

    const confirmPassword =
        confirmPasswordInput.value;


    /* NAME */

    if(!name){

        showMessage(
            "Student Name দিন।",
            "error"
        );

        nameInput.focus();

        return;

    }


    /* EMAIL */

    if(!email){

        showMessage(
            "Email address দিন।",
            "error"
        );

        emailInput.focus();

        return;

    }


    /* PASSWORD */

    if(!password){

        showMessage(
            "Password দিন।",
            "error"
        );

        passwordInput.focus();

        return;

    }


    if(password.length < 6){

        showMessage(
            "Password কমপক্ষে 6 characters হতে হবে।",
            "error"
        );

        passwordInput.focus();

        return;

    }


    /* CONFIRM */

    if(!confirmPassword){

        showMessage(
            "Confirm Password দিন।",
            "error"
        );

        confirmPasswordInput.focus();

        return;

    }


    if(password !== confirmPassword){

        showMessage(
            "Password এবং Confirm Password একই নয়।",
            "error"
        );

        confirmPasswordInput.focus();

        return;

    }


    /* LOADING */

    createButton.disabled =
        true;

    loading.style.display =
        "inline";

    createText.textContent =
        "Creating Account...";


    try{

        /* =============================================
           FIREBASE AUTH ACCOUNT
        ============================================= */

        const result =
            await auth.createUserWithEmailAndPassword(
                email,
                password
            );


        const user =
            result.user;


        /* =============================================
           USER DISPLAY NAME
        ============================================= */

        await user.updateProfile({

            displayName:
                name

        });


        /* =============================================
           FIRESTORE STUDENT PROFILE
        ============================================= */

        await db
            .collection("students")
            .doc(user.uid)
            .set({

                uid:
                    user.uid,

                name:
                    name,

                email:
                    email,

                role:
                    "student",

                targetDate:
                    "",

                targetDream:
                    "",

                selectedCourse:
                    "",

                createdAt:
                    firebase.firestore.FieldValue.serverTimestamp(),

                updatedAt:
                    firebase.firestore.FieldValue.serverTimestamp()

            });


        /* =============================================
           SUCCESS
        ============================================= */

        showMessage(
            "Account successfully created. Dashboard খুলছে...",
            "success"
        );


        setTimeout(
            function(){

                window.location.href =
                    "dashboard.html";

            },
            900
        );


    }catch(error){

        console.error(
            "SIGNUP ERROR:",
            error
        );


        showMessage(
            getErrorMessage(error),
            "error"
        );


        createButton.disabled =
            false;

        loading.style.display =
            "none";

        createText.textContent =
            "Create Account";

    }

}


/* =====================================================
   LOGIN BUTTON
===================================================== */

loginButton.addEventListener(
    "click",
    function(){

        window.location.href =
            "index.html";

    }
);


/* =====================================================
   ENTER KEY
===================================================== */

confirmPasswordInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            createAccount();

        }

    }
);


/* =====================================================
   ALREADY LOGGED IN
===================================================== */

auth.onAuthStateChanged(
    function(user){

        if(user){

            window.location.href =
                "dashboard.html";

        }

    }
);

</script>

</body>

</html>
