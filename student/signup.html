<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign up | mNEET-Pro</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script></head><body><header><a class="brand" href="index.html">mNEET-Pro</a></header><main class="wrap narrow"><section class="card"><h1>Create account</h1><form id="signup"><label>Full name</label><input name="name" required maxlength="80"><label>Email</label><input name="email" type="email" required autocomplete="email"><label>Password (minimum 6 characters)</label><input name="password" type="password" required minlength="6" autocomplete="new-password"><label>Phone (optional)</label><input name="phone" type="tel" maxlength="20"><button class="full">Create account</button></form><p>Already registered? <a href="index.html">Login</a></p></section></main><script>document.querySelector('#signup').addEventListener('submit',async e=>{e.preventDefault();let f=e.currentTarget;try{let c=await auth.createUserWithEmailAndPassword(f.email.value.trim(),f.password.value);await c.user.updateProfile({displayName:f.name.value.trim()});await db.collection('students').doc(c.user.uid).set({uid:c.user.uid,name:f.name.value.trim(),email:f.email.value.trim(),phone:f.phone.value.trim(),createdAt:firebase.firestore.FieldValue.serverTimestamp()});location.href='dashboard.html'}catch(err){MN.msg(err.message,true)}})</script></body></html>
