
<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d6035"><title>mNEET-Pro | Sign Up</title>
<link rel="icon" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css">
</head><body>
<main class="auth-page"><section class="auth-card">
<div class="auth-logo">mNEET-Pro</div><p class="auth-sub">Create your student account</p>
<form id="signupForm" class="form">
<div class="form-group"><label>Full Name</label><input id="signupName" class="input" required></div>
<div class="form-group"><label>Email</label><input id="signupEmail" class="input" type="email" required></div>
<div class="form-group"><label>Password</label><input id="signupPassword" class="input" type="password" minlength="6" required></div>
<button class="primary-btn" style="width:100%">Create Account</button>
</form>
<div class="auth-links"><a href="index.html">Back to Login</a></div>
<p id="signupMessage" style="margin-top:14px;text-align:center;font-size:11px;color:#d32f2f"></p>
</section></main>


<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

<script src="js/firebase.js"></script>
<script src="js/common.js"></script>
<script src="js/auth.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function(){
    document.getElementById("signupForm").addEventListener("submit", async function(e){
        e.preventDefault();
        const m=document.getElementById("signupMessage");
        m.textContent="Creating account...";
        try {
            await studentSignup(document.getElementById("signupName").value, document.getElementById("signupEmail").value, document.getElementById("signupPassword").value);
            window.location.replace("dashboard.html");
        } catch(err) { m.textContent=err.message; }
    });
});
</script>
</body></html>
