<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146c43"><title>Chapter | mNEET-Pro</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script></head><body><header><a class="brand" href="dashboard.html">mNEET-Pro</a><div><a href="profile.html">Profile</a> <button class="secondary" data-logout>Logout</button></div></header><div id="message" class="message" hidden></div><main class="wrap"><a id="back" href="courses.html">← Back</a><h1 id="title">Chapter</h1><section class="card"><div id="topics" class="empty">Loading topics…</div></section></main><nav class="bottom-nav"><a href="dashboard.html">Dashboard</a><a href="courses.html">Courses</a><a href="profile.html">Profile</a><a href="notifications.html">Notifications</a></nav><script>(async()=>{try{let u=await MN.requireUser(),courseId=MN.getParam('courseId'),chapterId=MN.getParam('chapterId');if(!courseId||!chapterId){MN.go('courses.html');return}if(!await MN.purchaseApproved(u.uid,courseId)){MN.msg('Course access is locked until admin approval.',true);setTimeout(()=>MN.go('course.html',{id:courseId}),1200);return}$('#back').href='course.html?id='+encodeURIComponent(courseId);let cRef=db.collection('courses').doc(courseId),ch=await cRef.collection('chapters').doc(chapterId).get();$('#title').textContent=ch.data()?.title||'Chapter';let ts=await cRef.collection('chapters').doc(chapterId).collection('topics').orderBy('order').get().catch(()=>cRef.collection('chapters').doc(chapterId).collection('topics').get());let box=$('#topics');box.innerHTML='';if(!ts.size){box.textContent='No topics published yet.';return}ts.docs.forEach(d=>{let t=d.data(),el=document.createElement('div');el.className='list-item';el.innerHTML='<div><b>'+MN.esc(t.title||'Topic')+'</b></div><a class="btn" href="topic.html?courseId='+encodeURIComponent(courseId)+'&chapterId='+encodeURIComponent(chapterId)+'&topicId='+encodeURIComponent(d.id)+'">Open</a>';box.append(el)})}catch(e){}})();</script></body></html>
