<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146c43"><title>Courses | mNEET-Pro</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script></head><body><header><a class="brand" href="dashboard.html">mNEET-Pro</a><div><a href="profile.html">Profile</a> <button class="secondary" data-logout>Logout</button></div></header><div id="message" class="message" hidden></div><main class="wrap"><h1>Biology courses</h1><p class="muted">Purchase requests are reviewed by the admin. Course access starts only after approval.</p><div id="courses" class="grid"><div class="empty">Loading…</div></div></main><nav class="bottom-nav"><a href="dashboard.html">Dashboard</a><a href="courses.html">Courses</a><a href="profile.html">Profile</a><a href="notifications.html">Notifications</a></nav><script>(async()=>{try{let u=await MN.requireUser(),snap=await db.collection('courses').where('active','==',true).get(),box=$('#courses');box.innerHTML='';if(!snap.size){box.innerHTML='<div class="card empty">No active courses available right now.</div>';return}for(let d of snap.docs){let c=d.data(),approved=await MN.purchaseApproved(u.uid,d.id),req=await db.collection('paymentRequests').where('uid','==',u.uid).where('courseId','==',d.id).where('status','==','pending').limit(1).get();let el=document.createElement('article');el.className='card';el.innerHTML='<h2>'+MN.esc(c.title||'Biology course')+'</h2><p>'+MN.esc(c.description||'')+'</p><div class="row"><b>'+MN.money(c.price)+'</b><span class="pill">'+(approved?'Purchased':req.size?'Approval pending':'Access locked')+'</span></div><div class="row" style="margin-top:14px">'+(approved?'<a class="btn" href="course.html?id='+encodeURIComponent(d.id)+'">Start learning</a>':req.size?'<button disabled>Awaiting admin</button>':'<a class="btn" href="course.html?id='+encodeURIComponent(d.id)+'&buy=1">Buy course</a>')+'</div>';box.append(el)}}catch(e){}})();</script></body></html>
