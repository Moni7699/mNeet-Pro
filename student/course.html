<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#146c43"><title>Course | mNEET-Pro</title><link rel="stylesheet" href="css/style.css"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="js/firebase.js"></script><script src="js/common.js"></script></head><body><header><a class="brand" href="dashboard.html">mNEET-Pro</a><div><a href="profile.html">Profile</a> <button class="secondary" data-logout>Logout</button></div></header><div id="message" class="message" hidden></div><main class="wrap"><a href="courses.html">← All courses</a><section class="card" id="course"><div class="empty">Loading course…</div></section><section class="card"><h2>Chapters</h2><div id="chapters" class="empty">Loading…</div></section></main><nav class="bottom-nav"><a href="dashboard.html">Dashboard</a><a href="courses.html">Courses</a><a href="profile.html">Profile</a><a href="notifications.html">Notifications</a></nav><script>(async()=>{try{let u=await MN.requireUser(),id=MN.getParam('id');if(!id){MN.go('courses.html');return}let doc=await db.collection('courses').doc(id).get();if(!doc.exists){MN.msg('Course not found.',true);return}let c=doc.data(),ok=await MN.purchaseApproved(u.uid,id);$('#course').innerHTML='<h1>'+MN.esc(c.title||'Biology course')+'</h1><p>'+MN.esc(c.description||'')+'</p><div class="row"><b>'+MN.money(c.price)+'</b><span class="pill">'+(ok?'Approved access':'Locked')+'</span></div>'+(ok?'':'<p class="muted">Payment submit korar por admin approval porjonto locked thakbe.</p><button id="buy">Request purchase</button>');if(!ok){$('#buy').onclick=async()=>{let settings=await MN.loadSettings();MN.go('payment.html',{courseId:id})}}let ch=await db.collection('courses').doc(id).collection('chapters').orderBy('order').get().catch(()=>db.collection('courses').doc(id).collection('chapters').get());let box=$('#chapters');box.innerHTML='';if(!ch.size){box.textContent='Chapters will appear here when the teacher publishes them.';return}ch.docs.forEach(d=>{let x=d.data(),el=document.createElement('div');el.className='list-item';el.innerHTML='<b>'+MN.esc(x.title||'Chapter')+'</b>'+(ok?'<a class="btn" href="chapter.html?courseId='+encodeURIComponent(id)+'&chapterId='+encodeURIComponent(d.id)+'">Open</a>':'<span class="pill">Locked</span>');box.append(el)})}catch(e){}})();</script></body></html>
